{% extends "base.html" %}
{% block title %}批改结果 · 雅思写作 AI 试用{% endblock %}
{% block body_attrs %} data-submission="{{ public_id }}"{% endblock %}
{% block content %}
<div class="result" id="result">
  <section class="result__source card" aria-labelledby="sourceTitle">
    <div class="card__head">
      <h2 id="sourceTitle">原稿</h2>
      <button type="button" class="btn btn--ghost btn--sm" data-copy="original">复制原稿</button>
    </div>
    <p class="meta" id="sourceMeta">加载中…</p>
    <h3 class="subhead">题干</h3>
    <p class="prompt" id="promptText"></p>
    <div id="imageBlock" hidden>
      <h3 class="subhead">题图</h3>
      <img class="task-image" id="taskImage" alt="题图">
      <div class="image-note" id="imageNote"></div>
      <div class="image-check" id="imageCheck" hidden></div>
    </div>
    <h3 class="subhead">学生原文 <span class="muted small">（只读，AI 不会修改原稿）</span></h3>
    <div class="essay" id="originalEssay"></div>
  </section>

  <section class="result__panels card" aria-label="AI 结果">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tab is-active" data-tab="evaluate" aria-selected="true">原稿评价<span class="dot" data-dot="evaluate"></span></button>
      <button type="button" role="tab" class="tab" data-tab="refine" aria-selected="false">逐句精修<span class="dot" data-dot="refine"></span></button>
      <button type="button" role="tab" class="tab" data-tab="rewrite" aria-selected="false">整篇改写<span class="dot" data-dot="rewrite"></span></button>
    </div>
    <div class="panel" data-panel="evaluate" role="tabpanel"></div>
    <div class="panel" data-panel="refine" role="tabpanel" hidden></div>
    <div class="panel" data-panel="rewrite" role="tabpanel" hidden></div>
  </section>
</div>
{% endblock %}

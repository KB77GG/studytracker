<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<!-- 设计原型：网页背词任务页各状态。产品页样式在 .pv 作用域内，供 static/css/practice_vocabulary.css 参考。示例词与数字均为样例。 -->
<title>网页背词任务页</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: a review bench. The left column lists states, the middle shows the 1:1 product
   screen scaled to fit, and notes sit underneath. The product screen is light-only and scoped to .pv
   (its own tokens follow DESIGN.md's Student palette); the surrounding chrome follows the viewer's theme. */
:root {
  --bg: #F1F4F3;
  --panel: #FFFFFF;
  --ink: #15201F;
  --muted: #586866;
  --line: #D9E1DF;
  --accent: #20756F;
  --accent-soft: #E2F1EE;
  --chip: #E8EEEC;
  --font-ui: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1413; --panel: #151E1D; --ink: #E3EBE9; --muted: #95A6A3; --line: #283432;
    --accent: #5BBDB2; --accent-soft: #19312E; --chip: #1D2827; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1413; --panel: #151E1D; --ink: #E3EBE9; --muted: #95A6A3; --line: #283432;
  --accent: #5BBDB2; --accent-soft: #19312E; --chip: #1D2827; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

.doc {
  max-width: 1720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 48px;
}
.doc-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.doc-title { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: 0; text-wrap: balance; }
.doc-sub { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--chip); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.doc-body { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 22px; margin-top: 18px; align-items: start; }
.scene-nav { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; max-height: calc(100vh - 24px); overflow: auto; padding-right: 4px; }
.scene-group h2 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.scene-group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.scene-group button {
  width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 10px; border-radius: 8px;
  font-size: 13.5px; color: var(--ink); cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
}
.scene-group button:hover { background: var(--chip); }
.scene-group button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.scene-group code { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.bench { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.urlbar {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-bottom: 0;
  border-radius: 12px 12px 0 0; background: var(--panel); font-family: var(--font-mono); font-size: 12px; color: var(--muted);
}
.urlbar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.urlbar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.urlbar b { margin-left: auto; font-weight: 600; white-space: nowrap; }
.viewport { border: 1px solid var(--line); border-radius: 0 0 12px 12px; overflow: hidden; background: var(--panel); }
.frame-shell { position: relative; overflow: hidden; }
.frame { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

.notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.note h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.note ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
.note code { font-family: var(--font-mono); font-size: 12px; background: var(--chip); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.scene-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.scene-name h2 { margin: 0; font-size: 17px; font-weight: 700; }
.scene-name span { color: var(--muted); font-size: 13px; }

.demo-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.demo-tools label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.demo-tools .tool-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.keylog { flex: 1 1 320px; min-width: 0; display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.keylog span { background: var(--chip); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.keylog span.ok { color: var(--accent); }

@media (max-width: 1100px) { .notes { grid-template-columns: 1fr 1fr; } }
@media (max-width: 860px) {
  .doc-body { grid-template-columns: minmax(0, 1fr); }
  .scene-nav { position: static; max-height: none; display: flex; overflow-x: auto; gap: 18px; padding-bottom: 6px; }
  .scene-group { flex: 0 0 auto; }
  .scene-group ul { display: flex; gap: 4px; }
  .scene-group button { white-space: nowrap; }
  .scene-group code { display: none; }
  .notes { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ============ Product screen (light only, scoped) ============ */
.pv {
  --pv-canvas: #F4F1EA; --pv-surface: #FFFEFA; --pv-surface-cool: #F7FAF9; --pv-border: #E3E8EE; --pv-border-strong: #D0D5DD;
  --pv-ink: #18243A; --pv-ink-muted: #667085; --pv-ink-subtle: #98A2B3;
  --pv-primary: #20756F; --pv-primary-strong: #145C57; --pv-primary-soft: #E6F5F2;
  --pv-success: #16A34A; --pv-success-ink: #166534; --pv-success-soft: #DCFCE7;
  --pv-warning: #D97706; --pv-warning-ink: #92400E; --pv-warning-soft: #FEF3C7;
  --pv-danger: #DC2626; --pv-danger-ink: #991B1B; --pv-danger-soft: #FEE2E2;
  --pv-neutral-soft: #EEF1F4; --pv-on-primary: #FFFFFF; --pv-toast: #18243A;
  --pv-font-ui: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --pv-font-entry: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", serif;
  --pv-font-ipa: "Lucida Sans Unicode", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --pv-font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  container-type: inline-size;
  position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background: var(--pv-canvas); color: var(--pv-ink); font-family: var(--pv-font-ui); font-size: 15px; line-height: 1.5;
  color-scheme: light;
}
.pv * { box-sizing: border-box; }
.pv p { margin: 0; }
.pv button { font-family: var(--pv-font-ui); cursor: pointer; }
.pv :focus-visible { outline: 3px solid rgba(32,117,111,.38); outline-offset: 2px; }

.pv-head { flex: 0 0 auto; height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 28px; background: var(--pv-surface); border-bottom: 1px solid var(--pv-border); }
.pv-back { height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border: 1px solid var(--pv-border-strong); border-radius: 9px; background: var(--pv-surface); color: var(--pv-ink); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.pv-back:hover { border-color: var(--pv-primary); color: var(--pv-primary-strong); }
.pv-titleblock { min-width: 0; flex: 1; display: flex; align-items: center; gap: 12px; }
.pv-titleblock h1 { margin: 0; min-width: 0; font-size: 16.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-chips { display: flex; gap: 6px; flex: 0 0 auto; }
.pv-chip { height: 24px; padding: 0 9px; border-radius: 6px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; background: var(--pv-neutral-soft); color: var(--pv-ink-muted); white-space: nowrap; }
.pv-chip--goal { background: var(--pv-primary-soft); color: var(--pv-primary-strong); }
.pv-chip--warn { background: var(--pv-warning-soft); color: var(--pv-warning-ink); }
.pv-chip--done { background: var(--pv-success-soft); color: var(--pv-success-ink); }
.pv-headright { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.pv-save { height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--pv-border); background: var(--pv-surface); font-size: 12.5px; font-weight: 600; color: var(--pv-ink-muted); white-space: nowrap; }
.pv-save .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pv-ink-subtle); }
.pv-save[data-tone="saving"] { color: var(--pv-primary-strong); }
.pv-save[data-tone="saved"] { color: var(--pv-success-ink); border-color: #BFE6CC; background: #F3FBF6; }
.pv-save[data-tone="saved"] .dot { background: var(--pv-success); }
.pv-save[data-tone="error"] { color: var(--pv-danger-ink); border-color: #F4C1C1; background: #FFF6F6; }
.pv-save[data-tone="error"] .dot { background: var(--pv-danger); }
.pv-save button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; font-size: 12.5px; }
.pv-spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: pvspin .8s linear infinite; flex: 0 0 auto; }
@keyframes pvspin { to { transform: rotate(360deg); } }
.pv-kbdbtn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--pv-border); border-radius: 8px; background: var(--pv-surface); color: var(--pv-ink-muted); font-size: 12.5px; font-weight: 600; }

.pv-rail { flex: 0 0 auto; padding: 14px 28px 0; }
.pv-steps { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pv-step { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--pv-ink-subtle); white-space: nowrap; }
.pv-step + .pv-step::before { content: ""; width: 26px; height: 1px; background: var(--pv-border-strong); }
.pv-step i { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; }
.pv-step--done { color: var(--pv-ink-muted); }
.pv-step--done i { background: var(--pv-ink-muted); border-color: var(--pv-ink-muted); color: var(--pv-on-primary); }
.pv-step--current { color: var(--pv-primary-strong); }
.pv-step--current i { background: var(--pv-primary); border-color: var(--pv-primary); color: var(--pv-on-primary); }
.pv-step small { font-family: var(--pv-font-mono); font-size: 12px; font-weight: 500; color: var(--pv-ink-muted); }
.pv-railbar { height: 3px; margin-top: 12px; border-radius: 2px; background: var(--pv-border); overflow: hidden; }
.pv-railbar span { display: block; height: 100%; background: var(--pv-primary); transition: width .3s ease; }

.pv-stage { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 26px 28px 30px; display: flex; flex-direction: column; align-items: center; position: relative; }
.pv-card { background: var(--pv-surface); border: 1px solid var(--pv-border); border-radius: 18px; box-shadow: 0 1px 2px rgba(24,36,58,.04); }
.pv-cols { width: 100%; max-width: 1120px; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 22px; align-items: start; }
.pv-entry { padding: 30px 36px 28px; min-width: 0; }
.pv-eyebrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12.5px; font-weight: 600; color: var(--pv-ink-muted); }
.pv-tag { height: 22px; padding: 0 8px; border-radius: 6px; background: var(--pv-neutral-soft); display: inline-flex; align-items: center; font-size: 11.5px; }
.pv-headword { margin: 18px 0 10px; font-family: var(--pv-font-entry); font-size: 56px; font-size: clamp(44px, 5cqi, 64px); font-weight: 700; line-height: 1.05; letter-spacing: -.005em; overflow-wrap: anywhere; }
.pv-ipa-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pv-ipa { font-family: var(--pv-font-ipa); font-size: 18px; color: var(--pv-ink-muted); }
.pv-meaning { margin-top: 18px !important; font-size: 24px; font-weight: 650; }
.pv-dots { display: flex; gap: 7px; margin-top: 28px; align-items: center; }
.pv-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--pv-border-strong); }
.pv-dots .v { background: var(--pv-primary); }
.pv-dots .c { background: var(--pv-surface); outline: 2px solid var(--pv-primary); outline-offset: 1px; }
.pv-dots em { margin-left: 8px; font-style: normal; font-size: 12px; color: var(--pv-ink-muted); }
.pv-material { padding: 24px 28px; display: grid; gap: 20px; background: var(--pv-surface-cool); min-width: 0; }
.pv-label { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; color: var(--pv-ink-muted); margin-bottom: 6px; }
.pv-example { font-family: var(--pv-font-entry); font-size: 20px; line-height: 1.55; }
.pv-example b { font-weight: 700; box-shadow: inset 0 -.42em 0 var(--pv-primary-soft); }
.pv-trans { margin-top: 6px !important; color: var(--pv-ink-muted); font-size: 14.5px; }
.pv-colloc { font-family: var(--pv-font-entry); font-size: 18px; }
.pv-note { font-size: 14.5px; }
.pv-sparse { color: var(--pv-ink-muted); font-size: 14px; padding: 14px 16px; border: 1px dashed var(--pv-border-strong); border-radius: 12px; }

.pv-audio { height: 40px; display: inline-flex; align-items: center; gap: 9px; padding: 0 14px 0 5px; border-radius: 999px; border: 1px solid var(--pv-border); background: var(--pv-surface); color: var(--pv-ink); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.pv-audio .ic { width: 30px; height: 30px; border-radius: 50%; background: var(--pv-primary); color: var(--pv-on-primary); display: grid; place-items: center; flex: 0 0 auto; }
.pv-audio--lg { height: 64px; padding: 0 24px 0 8px; font-size: 16px; gap: 12px; }
.pv-audio--lg .ic { width: 48px; height: 48px; }
.pv-audio[data-state="loading"] .ic { background: var(--pv-primary-soft); color: var(--pv-primary-strong); }
.pv-audio[data-state="error"] { border-color: #F4C1C1; color: var(--pv-danger-ink); }
.pv-audio[data-state="error"] .ic { background: var(--pv-danger); }
.pv-bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.pv-bars b { width: 3px; background: currentColor; border-radius: 1px; animation: pvbar 1s ease-in-out infinite; }
.pv-bars b:nth-child(2) { animation-delay: .15s; } .pv-bars b:nth-child(3) { animation-delay: .3s; }
@keyframes pvbar { 0%, 100% { height: 4px; } 50% { height: 14px; } }
.pv-playcount { font-size: 12.5px; color: var(--pv-ink-muted); }

.pv-qwrap { width: 100%; max-width: 760px; display: grid; gap: 14px; }
.pv-q { padding: 28px 40px 32px; }
.pv-qkind { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 600; color: var(--pv-ink-muted); }
.pv-prompt-zh { margin-top: 22px !important; font-size: 34px; font-weight: 700; line-height: 1.3; }
.pv-prompt-word { margin: 20px 0 6px; font-family: var(--pv-font-entry); font-size: 52px; font-weight: 700; line-height: 1.1; }
.pv-instr { margin-top: 8px !important; color: var(--pv-ink-muted); font-size: 14px; }
.pv-sentence { margin-top: 22px !important; font-family: var(--pv-font-entry); font-size: 24px; line-height: 1.6; }
.pv-sentence b { font-weight: 700; box-shadow: inset 0 -.42em 0 var(--pv-primary-soft); }
.pv-blank { display: inline-block; min-width: 4.2em; border-bottom: 2px solid var(--pv-ink); transform: translateY(-.12em); }
.pv-transbox { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--pv-surface-cool); border: 1px solid var(--pv-border); font-size: 14.5px; }
.pv-transbox span { color: var(--pv-ink-muted); font-size: 12px; font-weight: 700; margin-right: 8px; }
.pv-audio-center { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 22px; }

.pv-line { margin-top: 32px; position: relative; }
.pv-line input, .pv-fakeinput {
  width: 100%; border: 0; border-bottom: 2px solid var(--pv-ink); background: transparent; color: var(--pv-ink);
  font: 500 32px/1.3 var(--pv-font-ui); letter-spacing: .02em; padding: 6px 2px 10px; outline: none; border-radius: 0;
}
.pv-line input::placeholder { color: var(--pv-ink-subtle); font-weight: 400; }
.pv-line input:focus, .pv-fakeinput.is-focus { border-bottom-color: var(--pv-primary); box-shadow: 0 2px 0 var(--pv-primary); }
.pv-line input[readonly] { color: var(--pv-ink-muted); }
.pv-fakeinput { min-height: 59px; display: flex; align-items: flex-end; }
.pv-fakeinput .ime { text-decoration: underline dotted var(--pv-primary); text-underline-offset: 6px; }
.pv-fakeinput .caret { width: 2px; height: 34px; background: var(--pv-primary); margin-left: 2px; animation: pvblink 1s steps(1) infinite; }
@keyframes pvblink { 50% { opacity: 0; } }
.pv-imebar { position: absolute; left: 120px; top: 70px; display: flex; gap: 14px; padding: 8px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid var(--pv-border-strong); box-shadow: 0 8px 24px rgba(24,36,58,.14); font-size: 16px; }
.pv-imebar b { color: var(--pv-primary-strong); }
.pv-linehint { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--pv-ink-muted); }
.pv-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 6px; background: var(--pv-primary-soft); color: var(--pv-primary-strong); font-size: 12px; font-weight: 600; }
.pv-inline-alert { margin-top: 14px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: #FFF6F6; border: 1px solid #F4C1C1; color: var(--pv-danger-ink); font-size: 14px; }

.pv-options { display: grid; gap: 10px; margin-top: 24px; }
.pv-opt { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) 22px; align-items: center; gap: 14px; min-height: 56px; padding: 10px 16px; border: 1.5px solid var(--pv-border); border-radius: 12px; background: var(--pv-surface); color: var(--pv-ink); font-size: 17px; text-align: left; }
.pv-opt:hover { border-color: var(--pv-border-strong); }
.pv-opt kbd { width: 28px; height: 28px; border-radius: 8px; background: var(--pv-surface-cool); border: 1px solid var(--pv-border); display: grid; place-items: center; font: 600 13px var(--pv-font-mono); color: var(--pv-ink-muted); }
.pv-opt .mark { color: var(--pv-primary); opacity: 0; display: grid; place-items: center; }
.pv-opt[aria-checked="true"] { border-color: var(--pv-primary); background: var(--pv-primary-soft); }
.pv-opt[aria-checked="true"] kbd { background: var(--pv-primary); border-color: var(--pv-primary); color: var(--pv-on-primary); }
.pv-opt[aria-checked="true"] .mark { opacity: 1; }
.pv-opt.is-correct { border-color: var(--pv-success); background: var(--pv-success-soft); }
.pv-opt.is-correct .mark { opacity: 1; color: var(--pv-success-ink); }
.pv-opt.is-wrong { border-color: var(--pv-danger); background: var(--pv-danger-soft); }
.pv-opt.is-wrong .mark { opacity: 1; color: var(--pv-danger-ink); }

.pv-verdict { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; font-size: 16px; font-weight: 700; }
.pv-verdict .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--pv-on-primary); flex: 0 0 auto; }
.pv-verdict small { margin-left: auto; font-size: 13px; font-weight: 600; opacity: .9; text-align: right; }
.pv-verdict--ok { background: var(--pv-success-soft); color: var(--pv-success-ink); } .pv-verdict--ok .ic { background: var(--pv-success); }

  // Proofreading marks: the LCS alignment of the student's spelling against the revealed answer.
  function proof(student, correct) {
    const a = student, b = correct, n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i].toLowerCase() === b[j].toLowerCase() ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ops = []; let i = 0, j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && a[i].toLowerCase() === b[j].toLowerCase()) { ops.push(['=', a[i]]); i++; j++; }
      else if (i < n && j < m && dp[i + 1][j + 1] >= Math.max(dp[i + 1][j], dp[i][j + 1])) { ops.push(['~', a[i], b[j]]); i++; j++; }
      else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { ops.push(['+', b[j]]); j++; }
      else { ops.push(['-', a[i]]); i++; }
    }

      if (op[0] === '=') return esc(op[1]);

  const lexOf = (k) => LEX[k];
  function currentQ() {

  function railDemo() {

  function renderDemo(focus = true) {

      }

        else inner += options(CHOICES[q.key].options, { selected: D.selected });
        barHtml = bar([btn('忘了', { kind: 'ghost', act: 'forgot', disabled: D.inFlight })], kbdHint(q.kind === 'spell' ? [['Enter', '提交']] : [['1–4', '选择'], ['Enter', '提交']]), [btn(D.inFlight ? '提交中…' : (D.failNote ? '重试提交' : '提交'), { kind: 'primary', kbd: D.inFlight ? '' : '⏎', act: 'submit', busy: D.inFlight, disabled: D.inFlight })]);
      } else if (D.view === 'feedback') {
        const r = D.result;
        const v = r.forgot ? verdict('forgot', '已标记为忘了', '按未掌握记录 · 稍后再测') : r.ok ? verdict('ok', '回答正确', D.isRetry ? '再测通过' : '首答已记录') : verdict('bad', D.isRetry ? '仍需巩固' : '首答错误', D.isRetry ? '已记录' : '已记录 · 稍后再测');
        let answers = '';
        if (q.kind === 'spell') {

            r.ok ? `<dl class="pv-answers"><dt>你的答案</dt><dd lang="en">${esc(r.answer)}</dd></dl>` :
            `<dl class="pv-answers"><dt>你的答案</dt><dd>${proof(r.answer, w.word)}${legend}</dd><dt>正确答案</dt><dd class="correct" lang="en">${esc(w.word)}</dd></dl>`;
        } else {

        }
        inner += `<div style="margin-top:18px">${v}</div>${answers}${fbCard(w, { audio: D.audioState })}`;
        barHtml = bar([], kbdHint([['Enter', '继续'], ['R', '重播']]) + (r.ok ? '' : '　·　至少停留 0.5 秒'), [btn(D.inFlight ? '同步中…' : '继续', { kind: 'primary', kbd: D.inFlight ? '' : '⏎', act: 'submit', busy: D.inFlight })]);
      } else {
        inner += `<div style="margin-top:18px">${verdict('warn', D.correctionCount ? '还不对，再试一次' : '订正：照正确答案输入一次', `不计分 · 第 ${D.correctionCount + 1} / 2 次`)}</div><dl class="pv-answers"><dt>正确答案</dt><dd class="correct" lang="en">${esc(q.kind === 'spell' ? w.word : CHOICES[q.key].options[CHOICES[q.key].answer])}</dd></dl>`;
        inner += q.kind === 'spell' ? line({ id: 'demoInput', value: D.input, ph: '照着输入一次', hintL: '订正只帮助记忆，不改变首答成绩', hintR: '<span class="pv-kbd">Enter</span> 提交订正', readonly: D.inFlight }) : options(CHOICES[q.key].options, { selected: D.selected });
        barHtml = bar([], kbdHint([['Enter', '提交订正']]), [btn(D.inFlight ? '提交中…' : '提交订正', { kind: 'primary', kbd: D.inFlight ? '' : '⏎', act: 'submit', busy: D.inFlight, disabled: D.inFlight })]);
      }
      stage = t + qcard(label, pos, inner);
    } else if (D.view === 'retry_intro') {
      stage = inter({ eyebrow: '错题再测', title: `${D.retryQueue.length} 道题再做一次`, body: '刚才答错或标记为忘了的题，现在再测一次。再测只用于巩固，不改变首答成绩。', actions: btn('开始再测', { kind: 'primary', kbd: '⏎', act: 'submit' }) });
    } else if (D.view === 'settling') {
      railHtml = '';
      stage = inter({ eyebrow: '本组已完成', title: '正在提交任务结果…', body: '所有作答都已经保存，正在生成本次任务的结果。', actions: btn('提交中…', { kind: 'primary', busy: true, disabled: true }) });
    } else if (D.view === 'result') {
      railHtml = '';
      const firstOk = Object.values(D.firsts).filter(Boolean).length, total = Object.keys(D.firsts).length;
      stage = `<div class="pv-result"><section class="pv-card pv-score"><div class="pv-eyebrow"><span>首答正确率 · 刚刚完成</span></div><div class="big">${total ? Math.round(firstOk / total * 100) : 0}%</div><p class="frac">${firstOk} / ${total} 题首答正确</p><div class="pv-stats"><div class="pv-stat"><b>${D.retried}</b><span>再测完成</span></div><div class="pv-stat"><b>${D.stillWeak}</b><span>仍待复习</span></div><div class="pv-stat"><b>0</b><span>资料不足跳过</span></div></div><p class="note">首答成绩已记录。再测只用于巩固，不改变首答成绩。仍待复习的词会进入后续复习。</p></section><section class="pv-card pv-list"><h3>标记为忘了的词 · ${D.forgot.length}</h3>${D.forgot.length ? D.forgot.map((k) => `<div class="pv-row"><div><b lang="en">${esc(LEX[k].word)}</b><p>${esc(LEX[k].meaning)}</p></div>${audio('idle', '发音')}</div>`).join('') : '<p class="pv-trans">这次没有标记为忘了的词。</p>'}</section></div>`;
      barHtml = bar([btn('再走一遍', { kind: 'secondary', act: 'restart' })], '', [btn('返回任务列表', { kind: 'primary', act: 'back' })]);

  function log(text, ok) {
    const el = document.getElementById('keylog');
    const span = document.createElement('span');
    span.textContent = text; if (ok) span.className = 'ok';
    if (el.firstChild && el.firstChild.textContent === '按键判定会显示在这里') el.textContent = '';
    el.prepend(span);
    while (el.children.length > 4) el.lastChild.remove();
  }
  // State changes rearm Enter only when Enter is still physically held (see plan §4.3 rule 3).
  function transition(fn) { fn(); if (D.enterDown) D.enterArmed = false; renderDemo(); }
  function fakeRequest(label) {
    D.inFlight = true; D.save = ['saving', '保存中…']; renderDemo(false);
    return new Promise((resolve, reject) => {
      const fail = document.getElementById('demoOffline').checked;
      setTimeout(() => {
        if (fail) { document.getElementById('demoOffline').checked = false; D.inFlight = false; D.save = ['error', '保存失败']; reject(new Error('offline')); return; }
        D.inFlight = false; const now = new Date();
        D.save = ['saved', `已保存 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`];
        log(`${label}：服务端已确认`, true); resolve();
      }, fail ? 1100 : 480);
    });
  }
  function playDemoAudio() {
    const q = D.view === 'fam' ? DW[D.famIndex] : (currentQ() && lexOf(currentQ().key));

    if (D.view === 'question') { log('忽略：这类题作答前没有音频（读音会泄露答案）'); return; }

    log('重播发音', true);
  }
  function famNext() {
    if (D.famIndex < D.viewed) { transition(() => { D.famIndex = Math.min(2, D.famIndex + 1); }); return; }

      D.viewed = Math.max(D.viewed, D.famIndex + 1);
      if (D.viewed >= 3) { D.view = 'question'; D.phase = 'recall'; D.qi = 0; D.input = ''; log('整组浏览完成，服务端进入主动提取', true); }

  function submitAnswer(forgot) {

  }
  function submitCorrection() {

      if (ok) { log('订正通过', true); advance(); return; }

  frame.addEventListener('click', (e) => {
    if (mode !== 'demo') return;

    if (mode !== 'demo' || !D) return;

      if (e.repeat) { log('忽略 Enter：长按产生的重复事件'); return; }
      D.enterDown = true;
      if (!D.enterArmed) { log('忽略 Enter：请先松开再按'); return; }
      if (D.inFlight) { log('忽略 Enter：请求处理中'); return; }
      if (D.view === 'feedback' && performance.now() < D.dwellUntil) { log('忽略 Enter：错误反馈至少停留 0.5 秒'); return; }

      log('Enter：执行主操作', true);
      primary();
      return;
    }
    if (e.code === 'KeyR' && e.altKey) { e.preventDefault(); playDemoAudio(); return; }
    if (typing) return; // letters, digits and arrows inside the input stay text
    if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) { playDemoAudio(); return; }
    if (D.view === 'fam' && e.key === 'ArrowLeft') { e.preventDefault(); transition(() => { D.famIndex = Math.max(0, D.famIndex - 1); }); return; }
    if (D.view === 'fam' && e.key === 'ArrowRight') { e.preventDefault(); if (!D.inFlight) famNext(); return; }

    if (choiceView && /^[1-4]$/.test(e.key)) { D.selected = Number(e.key) - 1; log(`选择第 ${e.key} 项`, true); renderDemo(); return; }

      e.preventDefault(); const d = e.key === 'ArrowDown' ? 1 : -1;
      D.selected = ((D.selected == null ? (d > 0 ? -1 : 0) : D.selected) + d + 4) % 4; renderDemo();
    }
  });
  document.addEventListener('keyup', (e) => { if (e.key === 'Enter' && D) { D.enterDown = false; D.enterArmed = true; } });
  window.addEventListener('blur', () => { if (D) { D.enterDown = false; D.enterArmed = true; } });
  document.getElementById('demoRestart').addEventListener('click', demoReset);

  function setMode(m) {

      document.getElementById('sceneTitle').textContent = '试一试 · 综合训练小组';
      document.getElementById('sceneSub').textContent = '键盘可完整操作';
      setNotes({
        enter: ['3 个词：熟悉 → 3 道看中文写英文 → 3 道语境选择 → 错题再测 → 结算', '“下一次提交模拟断网”会让下一次请求失败，用来看保存失败的状态', '判分、保存和同步都是本地模拟，延迟约 0.5 秒'],
        keys: ['在输入框里试试按住 Enter 不放：只会提交一次', '用中文输入法打字时按 Enter 选词：不会提交', '用 Enter 提交后，要先松开 Enter 才能“继续”；答错时至少停留 0.5 秒', '选择题用 1–4，熟悉材料用 ← / →，R 或 ⌥R 重播'],
        impl: ['上方的按键判定就是 <code>routeKey()</code> 需要覆盖的单测用例', '答错（不是忘了）会先进入订正，这是综合目标的服务端规则', '音频用浏览器朗读代替 TTS，仅作演示']

      showScene(currentId);

  document.getElementById('modeDemo').addEventListener('click', () => setMode('demo'));

  try { const saved = localStorage.getItem('pv-proto-width'); if (saved && H[saved]) W = Number(saved); } catch (_) { /* storage optional */ }
  document.querySelectorAll('[data-w]').forEach((b) => {
    b.setAttribute('aria-pressed', String(Number(b.dataset.w) === W));
    b.addEventListener('click', () => { try { localStorage.setItem('pv-proto-width', b.dataset.w); } catch (_) { /* optional */ } });
  });
  showScene(location.hash && S.find((s) => '#' + s.id === location.hash) ? location.hash.slice(1) : 'fam');
  window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (S.find((s) => s.id === id)) { setMode('gallery'); showScene(id); } });
})();

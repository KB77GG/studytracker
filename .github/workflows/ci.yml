name: CI

# 质量关卡，独立于 deploy.yml（部署流程完全不受影响）。
# 设计原则：先“观察、不阻断”。lint 只报告问题，不会让构建失败、不会卡住你 push 即部署的流程。
# 等存量 lint 问题清理干净后，把 lint job 的 continue-on-error 去掉即可改成强制门禁。

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # 轻量单元测试：纯标准库、零第三方依赖，跑得快、稳定。作为真正的门禁（失败即红）。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install minimal deps
        # 多数轻量测试纯标准库；test_reading_vocab_grading 会 import api.* ，
        # 触发 api/__init__.py 的 `from flask import Blueprint`，故需 Flask（轻量、秒级）。
        run: pip install Flask
      - name: Run dependency-light unit tests
        run: |
          python -m unittest \
            tests.test_miniprogram_guest_access \
            tests.test_miniprogram_dictation_grouping \
            tests.test_inventory_toefl_materials \
            tests.test_organize_toefl_materials \
            tests.test_extract_toefl_answer_keys \
            tests.test_map_toefl_answers_to_practice_docs \
            tests.test_import_toefl_official_reading \
            tests.test_reading_vocab_grading \
            tests.test_stats_utils \
            -v
      - name: Guard legacy spelling correction queue
        run: node tests/test_dictation_spell_queue.js

  # 真实账号路由回归：测试在导入 app 前强制内存数据库和禁止联网。
  # 仅安装启动路由需要的轻量依赖，不加载语音/ML模型。
  account-provisioning:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install account regression dependencies
        run: |
          python -m pip install \
            'Flask>=2.3' 'Flask-Login>=0.6' 'Flask-SQLAlchemy>=3.1' \
            'PyJWT>=2.9' 'pypinyin>=0.55' 'requests>=2.31' \
            'certifi>=2024.0.0' 'websocket-client>=1.7' 'openpyxl>=3.1'
      - name: Test automatic student and parent accounts
        run: python -m unittest tests.test_auto_student_accounts -v

  task-planner:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install planner regression dependencies
        run: |
          python -m pip install \
            'Flask>=2.3' 'Flask-Login>=0.6' 'Flask-SQLAlchemy>=3.1' \
            'requests>=2.31' 'PyJWT>=2.9' 'pypinyin>=0.55'
      - name: Test scheduled assignment transactions and resources
        run: python -m unittest tests.test_task_planner tests.test_task_planner_resources -v
      - name: Test planner client behavior
        run: node --test tests/test_task_planner_client.js

  # 代码风格/静态检查：现阶段只报告，不阻断（continue-on-error）。
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true   # ← 存量清干净后删掉这一行即变强制门禁
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (advisory)
        run: ruff check --output-format=github .
      - name: Ruff format check (advisory)
        run: ruff format --check .

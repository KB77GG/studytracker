<script src="{{ url_for('static', filename='js/practice_shell.js') }}"></script>
<script>
const intensiveListeningExperienceMode = PracticeModes.resolve({ intensiveListeningMode: true });
const intensiveListeningCapabilities = PracticeModes.apply(document, intensiveListeningExperienceMode);
(function() {
  // ── State ──
  let data = null;
  let currentPartIdx = 0;
  let currentSegIdx = 0;
  let mode = 'sentence';  // sentence | dictation
  let isPlaying = false;
  let showOriginal = false;
  let showTranslation = false;
  let completedSegs = new Set();
  let freeProgress = {};
  let sentenceLoopActive = false;
  let repeatCount = 1;
  let repeatGapSeconds = 2;
  let autoRepeatActive = false;
  let autoRepeatTargetCount = 1;
  let autoRepeatCompletedCount = 0;
  let autoRepeatTimer = null;
  let segmentEndHandled = false;
  let segmentBoundaryFrame = null;
  let dictationLevel = 'standard';
  let currentDictationContext = null;
  const dictationStartedSegments = new Set();
  const correctionSegments = new Set();
  const firstAttemptGates = new Map();
  const dictationDrafts = new Map();
  const dictationLevelsBySegment = new Map();
  const pendingFirstAttempts = new Map();

  const audio = document.getElementById('audio');
  const exerciseId = "{{ exercise_id }}";

  // ── Task Mode ──
  const urlParams = new URLSearchParams(window.location.search);
  const taskId = urlParams.get('task_id');
  const taskToken = urlParams.get('token') || '';
  let taskProgress = {};  // segment_index -> result
  let taskTrainingPolicy = { locked: false, review_only: false };
  let taskReadOnly = false;
  let taskDateStatusText = '';
  const reviewListenedSegments = new Set();
  const freeStudentName = sessionStorage.getItem('listening_student') || localStorage.getItem('listening_student') || 'guest';
  let practiceShellController = null;

  function getFreeProgressStorageKey() {
    return `listening_free_progress_${exerciseId}_${freeStudentName}`;
  }

  // ── Error Summary (per-segment notes) ──
  let errorSummaries = {};            // { segGlobalIdx: "text" }
  let errorSummarySaveTimer = null;
  let errorSummaryDirty = false;

  function getErrorSummaryStorageKey() {
    return `listening_error_summary_${exerciseId}_${freeStudentName}`;
  }

  function loadErrorSummaries() {
    try {
      errorSummaries = JSON.parse(localStorage.getItem(getErrorSummaryStorageKey()) || '{}') || {};
    } catch (err) {
      errorSummaries = {};
    }
  }

  function saveErrorSummaries() {
    try {
      localStorage.setItem(getErrorSummaryStorageKey(), JSON.stringify(errorSummaries));
    } catch (err) {
      console.warn('error summary save failed', err);
    }
  }

  function setErrorSummaryStatus(text, cls) {
    const el = document.getElementById('errorSummaryStatus');
    if (!el) return;
    el.textContent = text || '';
    el.className = 'esb-status' + (cls ? ' ' + cls : '');
  }

  function loadErrorSummaryForCurrent() {
    const ta = document.getElementById('errorSummaryInput');
    if (!ta) return;
    const segGlobalIdx = getGlobalSegmentIndex();
    const value = errorSummaries[segGlobalIdx] || '';
    ta.value = value;
    errorSummaryDirty = false;
    setErrorSummaryStatus(value ? '已保存' : '', value ? 'saved' : '');
  }

  function persistCurrentErrorSummary(force) {
    if (taskReadOnly) return;
    const ta = document.getElementById('errorSummaryInput');
    if (!ta) return;
    const segGlobalIdx = getGlobalSegmentIndex();
    const val = ta.value;
    const prev = errorSummaries[segGlobalIdx] || '';
    if (!force && val === prev) {
      errorSummaryDirty = false;
      return;
    }
    if (val.trim()) {
      errorSummaries[segGlobalIdx] = val;
    } else {
      delete errorSummaries[segGlobalIdx];
    }
    saveErrorSummaries();
    errorSummaryDirty = false;
    setErrorSummaryStatus('已保存', 'saved');
    practiceShellController?.markSaved();
  }

  function scheduleErrorSummarySave() {
    errorSummaryDirty = true;
    setErrorSummaryStatus('未保存…', 'dirty');
    practiceShellController?.markDirty();
    if (errorSummarySaveTimer) clearTimeout(errorSummarySaveTimer);
    errorSummarySaveTimer = setTimeout(() => {
      persistCurrentErrorSummary(false);
    }, 700);
  }

  function loadFreeProgress() {
    try {
      freeProgress = JSON.parse(localStorage.getItem(getFreeProgressStorageKey()) || '{}') || {};
    } catch (err) {
      freeProgress = {};
    }
  }

  function saveFreeProgress() {
    try {
      localStorage.setItem(getFreeProgressStorageKey(), JSON.stringify(freeProgress));
      return true;
    } catch (err) {
      console.warn('free progress save failed', err);
      return false;
    }
  }

  practiceShellController = PracticeShell.init({
    fallbackUrl: taskId ? "{{ url_for('tasks_page') }}" : "{{ url_for('listening_index') }}",
    fallbackMode: taskId ? 'task_detail' : 'intensive_library',
    confirmExit: Boolean(taskId),
    initialSaved: true,
    save: () => {
      if (errorSummaryDirty) persistCurrentErrorSummary(true);
      return taskId ? true : saveFreeProgress();
    }
  });

  function clearFreeProgress() {
    freeProgress = {};
    try {
      localStorage.removeItem(getFreeProgressStorageKey());
    } catch (err) {
      console.warn('free progress clear failed', err);
    }
  }

  function clearFreeDictationTransientState() {
    ListeningCloze.clearFreePracticeTransientState({
      dictationStartedSegments,
      correctionSegments,
      firstAttemptGates,
      dictationDrafts,
      dictationLevelsBySegment,
      pendingFirstAttempts,
    }, !!taskId);
    currentDictationContext = null;
  }

  function getSegmentSourceIndex(seg, fallbackIdx) {
    return typeof seg?.source_index === 'number' ? seg.source_index : fallbackIdx;
  }

  function stripSpeakerLabel(text) {
    return (text || '')
      .trim()
      .replace(/^(?:[A-Z][A-Z\s.'&/-]{0,40}|[A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,3})\s*:\s*/, '');
  }

  function getPracticeText(seg) {
    return stripSpeakerLabel(seg?.text || '').trim();
  }

  function getCanonicalSegmentText(seg) {
    return String(seg?.text || '').trim();
  }

  function getProgressSegmentText(progress, seg) {
    return String(progress?.segment_text || getCanonicalSegmentText(seg)).trim();
  }

  function splitPracticeWords(text) {
    return (text || '').split(/\s+/).filter(Boolean);
  }

  function getCurrentModeRange() {
    const seg = currentSegments()[currentSegIdx];
    if (!seg) return null;

    return {
      start: seg.start,
      end: seg.end,
      text: getPracticeText(seg),
      translation: (seg.translation || '').trim(),
    };
  }

  function getEffectiveProgress(progressMap, segGlobalIdx, practiceText) {
    const progress = progressMap[segGlobalIdx];
    if (!progress) return null;
    if (progress.segment_text
      && ListeningCloze.stripSpeakerLabel(progress.segment_text) !== ListeningCloze.stripSpeakerLabel(practiceText)) {
      return null;
    }
    return progress;
  }

  function applyCompletedMarkers(progressMap) {
    completedSegs.clear();
    let globalOffset = 0;
    data.parts.forEach((part, pIdx) => {
      (part.segments || []).forEach((seg, sIdx) => {
        const realIdx = getSegmentSourceIndex(seg, globalOffset + sIdx);
        if (progressMap[realIdx] && progressMap[realIdx].is_completed) {
          completedSegs.add(`${pIdx}-${sIdx}`);
        }
      });
      globalOffset += (part.segments || []).length;
    });
  }

  function updatePracticeSubtitle(progressMap, totalSegs) {
    const sub = document.getElementById('exerciseSubtitle');
    if (!sub) return;
    const rows = Object.values(progressMap || {});
    const completedCount = rows.filter(r => r.is_completed).length;
    const correctWords = rows.reduce((sum, r) => sum + (Number(r.correct_words) || 0), 0);
    const totalWords = rows.reduce((sum, r) => sum + (Number(r.total_words) || 0), 0);
    const accuracy = totalWords > 0 ? Number((correctWords * 100 / totalWords).toFixed(1)) : 0;
    if (taskTrainingPolicy.review_only && taskId) {
      sub.textContent = `已完成 ${completedCount}/${totalSegs} 句 · 听辨核对不计正确率`;
    } else if (completedCount > 0) {
      sub.textContent = `已完成 ${completedCount}/${totalSegs} 句 · 正确率 ${formatAccuracy(accuracy)}%`;
    } else if (taskId) {
      sub.textContent = `已完成 0/${totalSegs} 句`;
    } else {
      sub.textContent = '自由练习 · 本地自动保存进度';
    }
  }

  function totalSegmentCount() {
    return data.parts.reduce((sum, part) => sum + (part.segments || []).length, 0);
  }

  function getActiveProgressMap() {
    return taskId ? taskProgress : freeProgress;
  }

  function getSegmentLocations() {
    const locations = [];
    let fallbackIndex = 0;
    data.parts.forEach((part, partIndex) => {
      (part.segments || []).forEach((seg, segmentIndex) => {
        locations.push({
          partIndex,
          segmentIndex,
          globalIndex: getSegmentSourceIndex(seg, fallbackIndex),
          displayNumber: locations.length + 1,
          seg,
        });
        fallbackIndex += 1;
      });
    });
    return locations;
  }

  function isLocationCompleted(location, progressMap = getActiveProgressMap()) {
    const progress = getEffectiveProgress(
      progressMap,
      location.globalIndex,
      getPracticeText(location.seg)
    );
    return !!(progress && progress.is_completed);
  }

  function findFirstPendingSegmentLocation(progressMap = getActiveProgressMap()) {
    return getSegmentLocations().find(location => !isLocationCompleted(location, progressMap)) || null;
  }

  function selectSegmentLocation(location) {
    if (!location) return;
    if (currentPartIdx !== location.partIndex) {
      currentPartIdx = location.partIndex;
      updatePartTabs();
      buildSentenceList();
    }
    selectSegment(location.segmentIndex);
  }

  function updateTaskCompletionPanel() {
    const panel = document.getElementById('taskCompletionPanel');
    if (!panel) return;
    if (!taskId || taskReadOnly) {
      panel.classList.remove('visible', 'completed');
      return;
    }
    const locations = getSegmentLocations();
    const progressMap = getActiveProgressMap();
    const completedCount = locations.filter(location => isLocationCompleted(location, progressMap)).length;
    const pending = findFirstPendingSegmentLocation(progressMap);
    const title = document.getElementById('taskCompletionTitle');
    const desc = document.getElementById('taskCompletionDesc');
    const action = document.getElementById('btnTaskCompletionAction');
    panel.classList.add('visible');
    panel.classList.toggle('completed', !pending && locations.length > 0);
    if (!pending && locations.length > 0) {
      title.textContent = `全部 ${locations.length} 句已完成`;
      desc.textContent = '最后一句保存后，系统已自动提交整项精听任务，无需再次整批提交。';
      action.textContent = '返回任务列表';
      action.onclick = () => { window.location.href = "{{ url_for('listening_index') }}"; };
      return;
    }
    title.textContent = `还有 ${Math.max(0, locations.length - completedCount)} 句未保存`;
    desc.textContent = pending
      ? `已保存 ${completedCount}/${locations.length} 句。完成第 ${pending.displayNumber} 句后，任务会自动提交。`
      : `已保存 ${completedCount}/${locations.length} 句。`;
    action.textContent = pending ? `前往第 ${pending.displayNumber} 句` : '继续练习';
    action.onclick = () => selectSegmentLocation(pending);
  }

  function goToNextSegmentOrPending() {
    const locations = getSegmentLocations();
    const currentPosition = locations.findIndex(location =>
      location.partIndex === currentPartIdx && location.segmentIndex === currentSegIdx);
    if (currentPosition >= 0 && currentPosition < locations.length - 1) {
      selectSegmentLocation(locations[currentPosition + 1]);
      return;
    }
    updateTaskCompletionPanel();
    const pending = findFirstPendingSegmentLocation();
    if (pending) {
      selectSegmentLocation(pending);
      showDictationValidationMessage(`已到最后一句；第 ${pending.displayNumber} 句还未保存，已为你返回。`);
      return;
    }
    showDictationValidationMessage(taskId
      ? '全部句子已保存，任务已自动提交。'
      : '已经到最后一句。');
    document.getElementById('taskCompletionPanel')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function getCurrentSegmentProgress(segGlobalIdx) {
    const seg = currentSegments()[currentSegIdx];
    const practiceText = getPracticeText(seg);
    if (taskId) return getEffectiveProgress(taskProgress, segGlobalIdx, practiceText);
    return getEffectiveProgress(freeProgress, segGlobalIdx, practiceText);
  }

  function resetCurrentSentenceState() {
    document.getElementById('scoreBar').style.display = 'none';
    document.getElementById('scoreCaption').textContent = '';
    document.getElementById('btnRetry').style.display = '';
  }

  const practiceStartedAt = Date.now();

  function computeDurationSeconds() {
    return Math.max(0, Math.round((Date.now() - practiceStartedAt) / 1000));
  }

  // ── Deterministic seed hash ──
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      hash = ((hash << 5) - hash) + ch;
      hash |= 0;
    }
    return hash;
  }

  function seededRandom(seed) {
    let s = seed;
    return function() {
      s = (s * 1664525 + 1013904223) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }

  // ── Load Data ──
  if (taskId) {
    // Task mode: load via task API (server uses current_user for auth if logged in)
    const tokenParam = taskToken ? `?token=${encodeURIComponent(taskToken)}` : '';
    fetch(`/api/student/listening/task/${taskId}${tokenParam}`)
      .then(r => r.json())
      .then(d => {
        if (!d.ok) { alert('加载失败: ' + (d.error || '未知错误')); return; }
        data = d.exercise;
        taskProgress = d.progress || {};
        taskTrainingPolicy = d.task?.listening_training_policy || { locked: false, review_only: false };
        taskReadOnly = !!d.task?.read_only;
        taskDateStatusText = d.task?.status_label || d.task?.task_status_label || d.task?.availability_label || '';
        if (taskReadOnly) {
          mode = 'sentence';
        } else if (taskTrainingPolicy.locked) {
          mode = taskTrainingPolicy.initial_mode === 'listen' ? 'sentence' : 'dictation';
        }
        init();
        updateDateGateUI();
      })
      .catch(e => alert('加载数据失败: ' + e.message));
  } else {
    // Free practice mode
    fetch(`/api/listening/${exerciseId}`)
      .then(r => r.json())
      .then(d => { data = d; loadFreeProgress(); init(); })
      .catch(e => alert('加载数据失败: ' + e.message));
  }

  function init() {
    document.getElementById('exerciseTitle').textContent = data.title;
    audio.src = `/static/listening/${data.audio}`;
    const freeResetBtn = document.getElementById('btnResetFreeProgress');
    if (freeResetBtn) {
      freeResetBtn.style.display = taskId ? 'none' : 'inline-flex';
    }

    loadErrorSummaries();
    bindErrorSummaryHandlers();

    // In task mode, show progress subtitle
    if (taskId) {
      const totalSegs = totalSegmentCount();
      applyCompletedMarkers(taskProgress);
      updatePracticeSubtitle(taskProgress, totalSegs);
    } else {
      const totalSegs = totalSegmentCount();
      applyCompletedMarkers(freeProgress);
      updatePracticeSubtitle(freeProgress, totalSegs);
    }

    updateTrainingPolicyUI();
    updateModeControls();
    buildPartTabs();
    buildSentenceList();
    const initialPending = taskId ? findFirstPendingSegmentLocation(taskProgress) : null;
    if (initialPending) selectSegmentLocation(initialPending);
    else selectSegment(0);
    updateTaskCompletionPanel();
    audio.addEventListener('timeupdate', onTimeUpdate);
    audio.addEventListener('loadedmetadata', updateAudioProgressDisplay);
  }

  // ── Part Tabs ──
  function buildPartTabs() {
    const container = document.getElementById('partTabs');
    container.innerHTML = '';
    data.parts.forEach((part, i) => {
      const btn = document.createElement('button');
      btn.className = 'part-tab' + (i === currentPartIdx ? ' active' : '');
      btn.textContent = part.name;
      btn.onclick = () => { currentPartIdx = i; buildSentenceList(); selectSegment(0); updatePartTabs(); };
      container.appendChild(btn);
    });
  }

  function updatePartTabs() {
    document.querySelectorAll('.part-tab').forEach((btn, i) => {
      btn.classList.toggle('active', i === currentPartIdx);
    });
  }

  function isSegmentPracticeMode() {
    return mode === 'sentence' || mode === 'dictation';
  }

  function clearAutoRepeatTimer() {
    if (autoRepeatTimer) {
      clearTimeout(autoRepeatTimer);
      autoRepeatTimer = null;
    }
  }

  function stopAutoRepeat(resetRemaining = true) {
    autoRepeatActive = false;
    clearAutoRepeatTimer();
    if (resetRemaining) {
      autoRepeatTargetCount = repeatCount;
      autoRepeatCompletedCount = 0;
    }
    segmentEndHandled = false;
  }

  function stopSegmentBoundaryMonitor() {
    if (segmentBoundaryFrame !== null) {
      cancelAnimationFrame(segmentBoundaryFrame);
      segmentBoundaryFrame = null;
    }
  }

  function startSegmentBoundaryMonitor() {
    stopSegmentBoundaryMonitor();
    const tick = () => {
      updateAudioProgressDisplay();
      handleSegmentBoundary(audio.currentTime);
      if (!audio.paused) segmentBoundaryFrame = requestAnimationFrame(tick);
    };
    segmentBoundaryFrame = requestAnimationFrame(tick);
  }

  function showPlaybackError() {
    updatePlayBtn(false);
    showDictationValidationMessage('音频暂时无法播放，请检查网络后重试。');
  }

  function safelyPlayAudio() {
    let playResult;
    try {
      playResult = audio.play();
    } catch (err) {
      console.error('audio playback failed', err);
      showPlaybackError();
      return Promise.resolve(false);
    }
    if (!playResult || typeof playResult.catch !== 'function') return Promise.resolve(true);
    return playResult.then(() => true).catch(err => {
      console.error('audio playback failed', err);
      showPlaybackError();
      return false;
    });
  }

  function playCurrentSegmentPass() {
    const seg = currentSegments()[currentSegIdx];
    if (!seg) return;
    segmentEndHandled = false;
    audio.currentTime = seg.start;
    updateAudioProgressDisplay();
    safelyPlayAudio();
  }

  function startAutoRepeatSequence() {
    const seg = currentSegments()[currentSegIdx];
    if (!seg) return;
    stopAutoRepeat(false);
    autoRepeatActive = true;
    autoRepeatTargetCount = repeatCount;
    autoRepeatCompletedCount = 0;
    playCurrentSegmentPass();
  }

  function normalizeDictationWord(word) {
    return (word || '')
      .toLowerCase()
      .replace(/[^\w]/g, '');
  }

  // ── Sentence List ──
  function buildSentenceList() {
    const container = document.getElementById('sentenceList');
    container.innerHTML = '';
    const segments = currentSegments();
    segments.forEach((seg, i) => {
      const div = document.createElement('div');
      div.className = 'sentence-item' + (i === currentSegIdx ? ' active' : '');
      if (completedSegs.has(`${currentPartIdx}-${i}`)) div.classList.add('completed');
      const dur = (seg.end - seg.start).toFixed(1);
      div.innerHTML = `
        <span class="sent-status">${completedSegs.has(`${currentPartIdx}-${i}`) ? '✓' : ''}</span>
        <span class="sent-label">第${i + 1}句</span>
        <span class="sent-dur">${dur}s</span>
      `;
      div.onclick = () => selectSegment(i);
      container.appendChild(div);
    });
  }

  function currentSegments() {
    return data.parts[currentPartIdx]?.segments || [];
  }

  // ── Select Segment ──
  function selectSegment(idx) {
    const segs = currentSegments();
    if (idx < 0 || idx >= segs.length) return;
    // 切换前先把当前句的错因总结落盘
    if (errorSummaryDirty) persistCurrentErrorSummary(true);
    stopAutoRepeat();
    audio.pause();
    currentSegIdx = idx;
    const seg = segs[idx];
    const segGlobalIdx = getGlobalSegmentIndex();
    if (taskTrainingPolicy.review_only) {
      mode = 'sentence';
    } else if (taskTrainingPolicy.locked && !getCurrentSegmentProgress(segGlobalIdx)) {
      mode = 'dictation';
    }
    if (taskTrainingPolicy.locked && !getCurrentSegmentProgress(segGlobalIdx)) {
      showOriginal = false;
      showTranslation = false;
      document.getElementById('btnShowText').classList.remove('on');
      document.getElementById('btnShowTrans').classList.remove('on');
    }

    // Update sidebar
    document.querySelectorAll('.sentence-item').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });
    // Scroll active into view
    const activeEl = document.querySelector('.sentence-item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

    document.getElementById('currentSentenceLabel').textContent =
      `第${idx + 1}句 / 共${segs.length}句`;

    // Seek audio
    segmentEndHandled = false;
    audio.currentTime = seg.start;
    updateAudioProgressDisplay();
    document.getElementById('totalTime').textContent = fmtTime(Math.max(0, seg.end - seg.start));

    // Render content based on mode
    renderContent();
    // 加载本句的错因总结
    loadErrorSummaryForCurrent();
  }

  // ── Render Content ──
  function renderContent() {
    const seg = currentSegments()[currentSegIdx];
    if (!seg) return;
    const modeRange = getCurrentModeRange();
    const practiceText = getPracticeText(seg);

    const area = document.getElementById('dictationArea');
    const origEl = document.getElementById('originalText');
    const transEl = document.getElementById('translationText');
    const scoreBar = document.getElementById('scoreBar');
    scoreBar.style.display = 'none';

    origEl.textContent = modeRange?.text || practiceText;
    origEl.className = 'original-text' + (showOriginal ? ' visible' : '');
    transEl.textContent = modeRange?.translation || '';
    transEl.className = 'translation-text' + (showTranslation ? ' visible' : '');

    if (mode === 'dictation') {
      renderDictation(seg);
    } else {
      renderDictationLevelPanel(false);
      updateDictationActions({ visible: false });
      resetCurrentSentenceState();
      area.innerHTML = '';
      const block = document.createElement('div');
      block.style.fontSize = '20px';
      block.style.lineHeight = '2';
      block.style.color = 'var(--text-muted)';
      block.style.padding = '24px 0';
      if (showOriginal) {
        block.style.color = 'var(--text)';
        block.textContent = modeRange?.text || practiceText || '当前片段没有可显示的文本';
      } else {
        block.innerHTML = '<span style="opacity:0.45;">当前为精听模式。先听，再按“显示原文”核对。</span>';
      }
      area.appendChild(block);
      if (taskTrainingPolicy.review_only && taskId) {
        const segGlobalIdx = getGlobalSegmentIndex();
        const progress = getCurrentSegmentProgress(segGlobalIdx);
        const complete = document.createElement('button');
        complete.type = 'button';
        complete.className = 'dictation-start-btn';
        complete.style.marginTop = '14px';
        complete.textContent = progress ? '本句已完成' : '完成本句听辨';
        complete.disabled = !!progress || !reviewListenedSegments.has(segGlobalIdx) || !showOriginal;
        complete.title = complete.disabled && !progress ? '请先完整听完本句并显示原文' : '';
        complete.onclick = completeCurrentReview;
        area.appendChild(complete);
      }
    }
    updateModeControls();
    updateDateGateUI();
  }

  function getGlobalSegmentIndex() {
    const seg = currentSegments()[currentSegIdx];
    if (seg && typeof seg.source_index === 'number') return seg.source_index;
    let idx = 0;
    for (let p = 0; p < currentPartIdx; p++) {
      idx += (data.parts[p]?.segments || []).length;
    }
    return idx + currentSegIdx;
  }

  function dictationStateKey(segGlobalIdx) {
    return String(segGlobalIdx);
  }

  function dictationDraftKey(segGlobalIdx, level = dictationLevel) {
    return `${segGlobalIdx}:${level}`;
  }

  function getDictationLevelForSegment(segGlobalIdx, savedProgress, sourceText = '') {
    const key = dictationStateKey(segGlobalIdx);
    if (dictationLevelsBySegment.has(key)) return dictationLevelsBySegment.get(key);
    // Historical results do not record a difficulty. Only exact coverage of
    // every spoken token is safe to show as a challenge textarea; partial
    // legacy records stay per-word regardless of the current global choice.
    if (savedProgress) {
      const inferred = savedProgress.training_level
        || ListeningCloze.inferSavedDictationLevel(sourceText || savedProgress.segment_text || '', savedProgress);
      dictationLevelsBySegment.set(key, inferred);
      return inferred;
    }
    const seg = currentSegments()[currentSegIdx];
    if (taskTrainingPolicy.locked && seg?.assigned_training_level) {
      dictationLevelsBySegment.set(key, seg.assigned_training_level);
      return seg.assigned_training_level;
    }
    return dictationLevel;
  }

  function freezeDictationLevel(segGlobalIdx, savedProgress, sourceText = '') {
    const key = dictationStateKey(segGlobalIdx);
    const level = getDictationLevelForSegment(segGlobalIdx, savedProgress, sourceText);
    dictationLevelsBySegment.set(key, level);
    return level;
  }

  function isDictationLevelFrozen(segGlobalIdx, savedProgress) {
    if (taskTrainingPolicy.locked && savedProgress) return false;
    return !!savedProgress || dictationLevelsBySegment.has(dictationStateKey(segGlobalIdx));
  }

  function getFirstAttemptGate(segGlobalIdx, hasSavedProgress) {
    const key = dictationStateKey(segGlobalIdx);
    if (!firstAttemptGates.has(key)) {
      firstAttemptGates.set(key, ListeningCloze.createFirstAttemptGate(hasSavedProgress));
    }
    return firstAttemptGates.get(key);
  }

  function getHideIndices(seg, segGlobalIdx, sourceText, savedProgress, level) {
    const savedLevel = savedProgress
      ? (savedProgress.training_level
        || ListeningCloze.inferSavedDictationLevel(sourceText || savedProgress.segment_text || '', savedProgress))
      : null;
    if (savedProgress && savedLevel === level && Array.isArray(savedProgress.hidden_word_indices)) {
      return savedProgress.hidden_word_indices.map(Number).filter(Number.isInteger);
    }
    const seed = `${taskId || freeStudentName}:${segGlobalIdx}:${level}`;
    return ListeningCloze.selectHiddenWordIndices(sourceText, level, { seed });
  }

  function renderDictationLevelPanel(visible, context) {
    const panel = document.getElementById('dictationLevelPanel');
    const options = document.getElementById('dictationLevelOptions');
    const desc = document.getElementById('dictationLevelDesc');
    panel.classList.toggle('visible', !!visible);
    if (!visible) return;
    const activeLevel = context?.level || dictationLevel;
    const active = ListeningCloze.LEVELS.find(level => level.key === activeLevel) || ListeningCloze.LEVELS[1];
    const frozen = !!context && isDictationLevelFrozen(context.segGlobalIdx, context.savedProgress);
    const ranks = { basic: 0, standard: 1, challenge: 2 };
    const assignedLevel = context?.seg?.assigned_training_level;
    const savedLevel = context?.savedProgress?.training_level || assignedLevel;
    desc.textContent = active.description;
    options.innerHTML = '';
    ListeningCloze.LEVELS.forEach(level => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'dictation-level-btn' + (level.key === activeLevel ? ' active' : '');
      button.dataset.dictationLevel = level.key;
      button.textContent = level.label;
      button.setAttribute('aria-pressed', String(level.key === activeLevel));
      const belowAssigned = !!(taskTrainingPolicy.locked && savedLevel
        && ranks[level.key] < ranks[savedLevel]);
      const challengeBlocked = level.key === 'challenge' && context?.seg?.challenge_allowed === false;
      const beforeFirstAttempt = !!(taskTrainingPolicy.locked && !context?.savedProgress);
      button.disabled = challengeBlocked || belowAssigned
        || (beforeFirstAttempt && level.key !== assignedLevel)
        || (frozen && level.key !== activeLevel);
      button.setAttribute('aria-disabled', String(button.disabled));
      if (button.disabled) button.title = challengeBlocked
        ? '本句较长，不开放整句听写'
        : (beforeFirstAttempt ? '正式首答使用助教布置的档位' : '复盘只可保持或升档');
      button.onclick = () => changeDictationLevel(level.key);
      options.appendChild(button);
    });
  }

  function updateDictationActions({ visible, correction = false, empty = false } = {}) {
    const actions = document.getElementById('dictationActions');
    const hint = document.getElementById('dictationActionHint');
    const submit = document.getElementById('btnSubmitDictation');
    actions.classList.toggle('visible', !!visible && !empty);
    hint.className = 'dictation-action-hint' + (correction ? ' correction' : '');
    hint.textContent = correction
      ? '订正仅在本地核对，不会再次提交或改写首答成绩。'
      : '至少填写一个答案后提交；提交后会立即显示逐词结果和正确答案。';
    submit.textContent = correction ? '检查订正' : '提交首答';
  }

  function showDictationValidationMessage(text) {
    const area = document.getElementById('dictationArea');
    const existing = area.querySelector('.dictation-validation-message');
    if (existing) existing.remove();
    const message = document.createElement('div');
    message.className = 'dictation-validation-message';
    message.setAttribute('role', 'alert');
    message.textContent = text;
    area.prepend(message);
  }

  function markFirstAttemptSavePending(context, grade, answers) {
    pendingFirstAttempts.set(context.stateKey, {
      sourceText: context.sourceText,
      hiddenIndices: [...context.hiddenIndices],
      level: context.level,
      answers: [...answers],
      grade,
    });
    if (currentDictationContext?.stateKey === context.stateKey) {
      document.getElementById('scoreCaption').textContent =
        '首答保存未确认；请刷新确认，避免重复提交覆盖成绩。';
      document.getElementById('btnRetry').style.display = 'none';
    }
  }

  function getWordAffixes(raw, display) {
    const safeRaw = String(raw || '');
    const safeDisplay = String(display || '');
    const start = safeDisplay ? safeRaw.indexOf(safeDisplay) : -1;
    if (start < 0) return { prefix: '', suffix: '' };
    return {
      prefix: safeRaw.slice(0, start),
      suffix: safeRaw.slice(start + safeDisplay.length),
    };
  }

  function appendWordResultLabel(parent, result) {
    const label = document.createElement('span');
    label.className = 'word-result-label ' + (result.isCorrect ? 'correct' : 'incorrect');
    label.textContent = result.isCorrect ? '正确' : '订正';
    parent.appendChild(label);
  }

  function renderChallengeResults(area, grade) {
    const previous = area.querySelector('.challenge-results');
    if (previous) previous.remove();
    const results = document.createElement('div');
    results.className = 'challenge-results';
    grade.results.forEach(result => {
      const chip = document.createElement('span');
      chip.className = 'challenge-result ' + (result.isCorrect ? 'correct' : 'incorrect');
      chip.textContent = result.isExtra
        ? `${result.rawAnswer} · 多余`
        : (result.isCorrect ? `${result.answer} · 正确` : `${result.answer} · 需订正`);
      results.appendChild(chip);
    });
    area.appendChild(results);
  }

  function applyDictationGrade(context, grade, {
    correction = false,
    savedProgress = null,
    pendingSave = false,
    autoplay = true,
  } = {}) {
    const area = document.getElementById('dictationArea');
    const isChallenge = context.level === 'challenge';
    if (isChallenge) {
      const input = area.querySelector('.challenge-input');
      if (input) {
        input.disabled = true;
        input.className = 'challenge-input ' + (grade.accuracy === 100 ? 'correct' : 'incorrect');
        input.value = grade.results
          .filter(result => !result.isExtra)
          .map(result => result.isCorrect ? result.rawAnswer : result.answer)
          .join(' ');
        input.setAttribute('aria-label', `整句听写，${grade.correctWords}/${grade.totalWords} 词正确`);
      }
      renderChallengeResults(area, grade);
    } else {
      const inputs = Array.from(area.querySelectorAll('input[data-blank-index]'));
      inputs.forEach((input, index) => {
        const result = grade.results[index];
        if (!result) return;
        input.className = result.isCorrect ? 'correct' : 'incorrect';
        input.value = result.isCorrect ? result.rawAnswer : result.answer;
        input.disabled = true;
        input.title = result.answer;
        input.setAttribute('aria-label', `第 ${index + 1} 个听写词，${result.isCorrect ? '正确' : '需订正，正确答案 ' + result.answer}`);
        const slot = input.closest('.word-slot');
        if (slot) {
          const answerLength = Array.from(String(result.answer || '')).length;
          const answerWidth = Math.max(102, Math.min(240, answerLength * 11 + 24));
          slot.classList.add('graded');
          slot.style.setProperty('--graded-input-width', `${answerWidth}px`);
          const existingLabel = slot.querySelector('.word-result-label');
          if (existingLabel) {
            existingLabel.className = 'word-result-label ' + (result.isCorrect ? 'correct' : 'incorrect');
            existingLabel.textContent = result.isCorrect ? '正确' : '订正';
          } else {
            appendWordResultLabel(slot, result);
          }
        }
      });
    }

    const persisted = savedProgress && !correction ? savedProgress : null;
    const accuracy = persisted ? Number(persisted.accuracy || 0) : grade.accuracy;
    const correctWords = persisted ? Number(persisted.correct_words || 0) : grade.correctWords;
    const totalWords = persisted ? Number(persisted.total_words || 0) : grade.totalWords;
    document.getElementById('scoreValue').textContent = formatAccuracy(accuracy);
    document.getElementById('scoreDetail').textContent = `${correctWords}/${totalWords} 词正确`;
    document.getElementById('scoreCaption').textContent = pendingSave
      ? '首答保存未确认；请刷新确认，避免重复提交覆盖成绩。'
      : (correction
        ? '订正结果仅本地核对，首答成绩保持不变。'
        : '已显示首答逐词结果和正确答案。');
    document.getElementById('btnRetry').style.display = pendingSave ? 'none' : '';
    document.getElementById('scoreBar').style.display = 'flex';
    updateDictationActions({ visible: false });
  }

  function gradeSavedDictation(sourceText, hiddenIndices, savedProgress) {
    const localGrade = ListeningCloze.gradeAnswers(
      sourceText,
      hiddenIndices,
      savedProgress.answers_json || []
    );
    const canonicalResults = Array.isArray(savedProgress.results) ? savedProgress.results : [];
    if (!canonicalResults.length) return localGrade;
    return {
      ...localGrade,
      results: canonicalResults,
      accuracy: Number(savedProgress.accuracy || 0),
      correctWords: Number(savedProgress.correct_words || 0),
      totalWords: Number(savedProgress.total_words || 0),
    };
  }

  function renderWordSlots(area, context, draftAnswers) {
    const tokens = ListeningCloze.tokenizeSentence(context.sourceText);
    const hiddenSet = new Set(context.hiddenIndices);
    const answerByIndex = new Map(ListeningCloze.expectedTokens(context.sourceText, context.hiddenIndices)
      .map((token, index) => [token.index, { token, blankIndex: index }]));

    tokens.forEach(token => {
      const answerMeta = answerByIndex.get(token.index);
      if (!hiddenSet.has(token.index) || !answerMeta) {
        const visible = document.createElement('span');
        visible.className = 'word-visible';
        visible.textContent = token.raw + ' ';
        area.appendChild(visible);
        return;
      }
      const affixes = getWordAffixes(token.raw, token.display);
      if (affixes.prefix) area.appendChild(document.createTextNode(affixes.prefix));
      const slot = document.createElement('span');
      slot.className = 'word-slot';
      const input = document.createElement('input');
      input.type = 'text';
      input.autocomplete = 'off';
      input.dataset.blankIndex = answerMeta.blankIndex;
      input.dataset.wordIndex = token.index;
      input.dataset.answer = token.normalized;
      input.dataset.displayAnswer = token.display;
      input.value = draftAnswers[answerMeta.blankIndex] || '';
      input.setAttribute('aria-label', `第 ${answerMeta.blankIndex + 1} 个听写词`);
      input.addEventListener('keydown', onDictationKey);
      input.addEventListener('input', saveCurrentDictationDraft);
      slot.appendChild(input);
      area.appendChild(slot);
      if (affixes.suffix) area.appendChild(document.createTextNode(affixes.suffix));
      area.appendChild(document.createTextNode(' '));
    });
  }

  function renderDictation(seg) {
    const area = document.getElementById('dictationArea');
    area.innerHTML = '';
    resetCurrentSentenceState();
    const segGlobalIdx = getGlobalSegmentIndex();
    const savedProgress = getCurrentSegmentProgress(segGlobalIdx);
    const stateKey = dictationStateKey(segGlobalIdx);
    const pendingAttempt = pendingFirstAttempts.get(stateKey);
    const sourceText = pendingAttempt?.sourceText || getProgressSegmentText(savedProgress, seg);
    const level = pendingAttempt?.level || getDictationLevelForSegment(segGlobalIdx, savedProgress, sourceText);
    const hiddenIndices = pendingAttempt?.hiddenIndices
      || getHideIndices(seg, segGlobalIdx, sourceText, savedProgress, level);
    const expected = ListeningCloze.expectedTokens(sourceText, hiddenIndices);
    const correction = correctionSegments.has(stateKey);
    const hasSavedProgress = !!savedProgress;
    const hasPendingAttempt = !!pendingAttempt;
    const context = {
      seg,
      segGlobalIdx,
      sourceText,
      hiddenIndices,
      expected,
      level,
      savedProgress,
      pendingAttempt,
      stateKey,
      correction,
    };
    currentDictationContext = context;
    getFirstAttemptGate(segGlobalIdx, hasSavedProgress);
    renderDictationLevelPanel(true, context);

    if (!expected.length) {
      const empty = document.createElement('div');
      empty.className = 'dictation-empty-state';
      empty.textContent = '这一句没有可作答的英语词。请使用“句子精听”先听和核对原文。';
      area.appendChild(empty);
      updateDictationActions({ visible: false, empty: true });
      return;
    }

    if (!hasSavedProgress && !hasPendingAttempt && !dictationStartedSegments.has(stateKey)) {
      const intro = document.createElement('div');
      intro.className = 'dictation-intro';
      intro.innerHTML = '<strong>先听，再填</strong><span>先用上方“播放 / 重播”听完整句；准备好后再开始作答。不会锁住播放控制。</span>';
      const start = document.createElement('button');
      start.type = 'button';
      start.className = 'dictation-start-btn';
      start.textContent = '开始作答';
      start.onclick = startCurrentDictation;
      intro.appendChild(start);
      area.appendChild(intro);
      updateDictationActions({ visible: false });
      return;
    }

    const draftKey = dictationDraftKey(segGlobalIdx, level);
    const draft = correction
      ? []
      : (pendingAttempt?.answers || dictationDrafts.get(draftKey) || []);
    if (level === 'challenge') {
      const input = document.createElement('textarea');
      input.className = 'challenge-input';
      input.id = 'challengeDictationInput';
      input.placeholder = '听完后输入整句…';
      input.value = draft[0] || '';
      input.setAttribute('aria-label', '整句听写输入，不显示答案长度');
      input.addEventListener('input', saveCurrentDictationDraft);
      input.addEventListener('keydown', onChallengeKey);
      area.appendChild(input);
    } else {
      renderWordSlots(area, context, draft);
    }
    updateDictationActions({ visible: true, correction });

    if (hasSavedProgress && !correction) {
      const grade = gradeSavedDictation(sourceText, hiddenIndices, savedProgress);
      applyDictationGrade(context, grade, { savedProgress, autoplay: false });
      return;
    }

    if (hasPendingAttempt && !correction) {
      applyDictationGrade(context, pendingAttempt.grade, { pendingSave: true, autoplay: false });
      return;
    }

    setTimeout(() => {
      const first = area.querySelector('input, textarea');
      if (first) first.focus();
    }, 100);
  }

  function onDictationKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      checkDictation();
    } else if (e.key === 'Tab') {
      // Move to next input
      e.preventDefault();
      const inputs = document.querySelectorAll('.dictation-area input');
      const arr = Array.from(inputs);
      const idx = arr.indexOf(e.target);
      if (idx < arr.length - 1) arr[idx + 1].focus();
      else checkDictation();
    }
  }

  function onChallengeKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      checkDictation();
    }
  }

  function saveCurrentDictationDraft() {
    const context = currentDictationContext;
    if (!context || context.savedProgress || context.correction) return;
    if (context.level === 'challenge') {
      const input = document.getElementById('challengeDictationInput');
      const value = input?.value || '';
      if (value.trim()) freezeDictationLevel(context.segGlobalIdx, context.savedProgress);
      dictationDrafts.set(dictationDraftKey(context.segGlobalIdx, context.level), [value]);
      return;
    }
    const values = Array.from(document.querySelectorAll('.dictation-area input[data-blank-index]'))
      .map(input => input.value || '');
    if (values.some(value => value.trim())) freezeDictationLevel(context.segGlobalIdx, context.savedProgress);
    dictationDrafts.set(dictationDraftKey(context.segGlobalIdx, context.level), values);
  }

  function startCurrentDictation() {
    if (taskReadOnly) return;
    const segGlobalIdx = getGlobalSegmentIndex();
    const context = currentDictationContext;
    freezeDictationLevel(segGlobalIdx, context?.savedProgress);
    dictationStartedSegments.add(dictationStateKey(segGlobalIdx));
    renderContent();
  }

  function startCorrection() {
    if (taskReadOnly) return;
    const context = currentDictationContext;
    if (!context) return;
    const gate = getFirstAttemptGate(context.segGlobalIdx, !!context.savedProgress);
    if (!gate.enterCorrection()) return;
    correctionSegments.add(context.stateKey);
    dictationStartedSegments.add(context.stateKey);
    dictationDrafts.delete(dictationDraftKey(context.segGlobalIdx, context.level));
    renderContent();
    startAutoRepeatSequence();
  }

  function confirmDisplayedFirstAttempt(savedProgress) {
    document.getElementById('scoreValue').textContent = formatAccuracy(savedProgress.accuracy);
    document.getElementById('scoreDetail').textContent =
      `${Number(savedProgress.correct_words || 0)}/${Number(savedProgress.total_words || 0)} 词正确`;
    document.getElementById('scoreCaption').textContent = '首答已保存；已显示逐词结果和正确答案。';
    document.getElementById('btnRetry').style.display = '';
  }

  function changeDictationLevel(nextLevel) {
    if (taskReadOnly) return;
    if (!ListeningCloze.LEVELS.some(level => level.key === nextLevel)) return;
    const context = currentDictationContext;
    if (context && nextLevel === context.level) return;
    if (context && isDictationLevelFrozen(context.segGlobalIdx, context.savedProgress)) {
      showDictationValidationMessage(context.savedProgress
        ? '本句已有保存进度，难度已冻结；请切换到未开始的新句后再选择。'
        : '本句已开始作答，难度已冻结以保留当前答案。');
      return;
    }
    saveCurrentDictationDraft();
    dictationLevel = nextLevel;
    if (context?.savedProgress && taskTrainingPolicy.locked) {
      dictationLevelsBySegment.set(context.stateKey, nextLevel);
      correctionSegments.add(context.stateKey);
      dictationStartedSegments.add(context.stateKey);
    }
    renderContent();
  }

  function checkDictation() {
    if (taskReadOnly) return;
    const context = currentDictationContext;
    if (!context || !context.expected.length) return;
    const correction = context.correction;
    let answers;
    if (context.level === 'challenge') {
      const input = document.getElementById('challengeDictationInput');
      const value = input?.value || '';
      if (!value.trim()) {
        showDictationValidationMessage('请先输入整句或意群，再提交。');
        return;
      }
      answers = ListeningCloze.splitChallengeAnswers(value, context.expected.length);
    } else {
      answers = Array.from(document.querySelectorAll('.dictation-area input[data-blank-index]'))
        .map(input => input.value || '');
      if (!answers.some(answer => answer.trim())) {
        showDictationValidationMessage('请至少填写一个听写词，再提交。');
        return;
      }
    }
    const grade = ListeningCloze.gradeAnswers(context.sourceText, context.hiddenIndices, answers);

    if (correction) {
      applyDictationGrade(context, grade, { correction: true });
      return;
    }

    const gate = getFirstAttemptGate(context.segGlobalIdx, !!context.savedProgress);
    if (!gate.beginFirstAttempt()) return;
    freezeDictationLevel(context.segGlobalIdx, context.savedProgress);
    applyDictationGrade(context, grade, { pendingSave: true });

    if (taskId) {
      fetch(`/api/student/listening/task/${taskId}/segment/${context.segGlobalIdx}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: taskToken,
          segment_text: context.sourceText,
          hidden_word_indices: context.hiddenIndices,
          answers: answers,
          correct_words: grade.correctWords,
          total_words: grade.totalWords,
          training_level: context.level,
          duration_seconds: computeDurationSeconds(),
        })
      })
      .then(r => r.json())
      .then(d => {
        if (d.ok) {
          pendingFirstAttempts.delete(context.stateKey);
          const savedSegment = d.segment || {};
          taskProgress[context.segGlobalIdx] = {
            segment_index: context.segGlobalIdx,
            segment_text: savedSegment.segment_text || context.sourceText,
            correct_words: Number(savedSegment.correct_words ?? grade.correctWords),
            total_words: Number(savedSegment.total_words ?? grade.totalWords),
            accuracy: Number(savedSegment.accuracy ?? grade.accuracy),
            is_completed: true,
            hidden_word_indices: savedSegment.hidden_word_indices || context.hiddenIndices,
            answers_json: savedSegment.answers || answers,
            results: Array.isArray(savedSegment.results) ? savedSegment.results : [],
            training_level: savedSegment.training_level || context.level,
          };
          applyCompletedMarkers(taskProgress);
          buildSentenceList();
          updatePracticeSubtitle(taskProgress, totalSegmentCount());
          updateTaskCompletionPanel();
          renderContent();
          confirmDisplayedFirstAttempt(taskProgress[context.segGlobalIdx]);
          practiceShellController?.markSaved();
        } else {
          markFirstAttemptSavePending(context, grade, answers);
          practiceShellController?.setStatus('保存失败，点击重试', 'error');
        }
      })
      .catch(e => {
        console.error('保存进度失败:', e);
        markFirstAttemptSavePending(context, grade, answers);
        practiceShellController?.setStatus('保存失败，点击重试', 'error');
      });
    } else {
      freeProgress[context.segGlobalIdx] = {
        segment_index: context.segGlobalIdx,
        segment_text: context.sourceText,
        correct_words: grade.correctWords,
        total_words: grade.totalWords,
        accuracy: grade.accuracy,
        is_completed: true,
        hidden_word_indices: context.hiddenIndices,
        answers_json: answers,
        training_level: context.level,
      };
      if (saveFreeProgress()) {
        applyCompletedMarkers(freeProgress);
        buildSentenceList();
        updatePracticeSubtitle(freeProgress, totalSegmentCount());
        confirmDisplayedFirstAttempt(freeProgress[context.segGlobalIdx]);
        practiceShellController?.markSaved();
      } else {
        delete freeProgress[context.segGlobalIdx];
        markFirstAttemptSavePending(context, grade, answers);
        practiceShellController?.setStatus('保存失败，点击重试', 'error');
      }
    }
  }

  // ── Audio Time Update ──
  function updateAudioProgressDisplay() {
    const modeRange = getCurrentModeRange();
    if (modeRange && isSegmentPracticeMode()) {
      const duration = Math.max(0, modeRange.end - modeRange.start);
      const relative = Math.min(duration, Math.max(0, Number(audio.currentTime || 0) - modeRange.start));
      document.getElementById('currentTime').textContent = fmtTime(relative);
      document.getElementById('totalTime').textContent = fmtTime(duration);
      document.getElementById('progressFill').style.width =
        (duration > 0 ? relative / duration * 100 : 0) + '%';
      return;
    }
    const current = Number(audio.currentTime || 0);
    const duration = Number(audio.duration || 0);
    document.getElementById('currentTime').textContent = fmtTime(current);
    document.getElementById('totalTime').textContent = fmtTime(duration);
    document.getElementById('progressFill').style.width =
      (duration > 0 ? current / duration * 100 : 0) + '%';
  }

  function handleSegmentBoundary(t) {
    const modeRange = getCurrentModeRange();
    if (modeRange && t >= modeRange.end && !segmentEndHandled) {
        segmentEndHandled = true;
        if (taskTrainingPolicy.review_only && taskId) {
          reviewListenedSegments.add(getGlobalSegmentIndex());
        }
        if (sentenceLoopActive && isSegmentPracticeMode()) {
          segmentEndHandled = false;
          audio.currentTime = modeRange.start;
        } else if (autoRepeatActive) {
          audio.pause();
          updatePlayBtn(false);
          autoRepeatCompletedCount += 1;
          if (autoRepeatCompletedCount < autoRepeatTargetCount) {
            clearAutoRepeatTimer();
            autoRepeatTimer = setTimeout(() => {
              if (!autoRepeatActive) return;
              playCurrentSegmentPass();
            }, repeatGapSeconds * 1000);
          } else {
            stopAutoRepeat();
          }
        } else {
          audio.pause();
          updatePlayBtn(false);
        }
        if (taskTrainingPolicy.review_only && taskId) renderContent();
    }
  }

  function onTimeUpdate() {
    updateAudioProgressDisplay();
    handleSegmentBoundary(audio.currentTime);
  }

  function clampToCurrentRange(time) {
    const range = getCurrentModeRange();
    if (!range || !isSegmentPracticeMode()) {
      return Math.min(Number(audio.duration || time), Math.max(0, time));
    }
    return Math.min(range.end, Math.max(range.start, time));
  }

  function seekWithinCurrentRange(deltaSeconds) {
    if (taskTrainingPolicy.review_only
      && deltaSeconds > 0
      && !getCurrentSegmentProgress(getGlobalSegmentIndex())) return;
    stopAutoRepeat();
    audio.currentTime = clampToCurrentRange(Number(audio.currentTime || 0) + deltaSeconds);
    updateAudioProgressDisplay();
  }

  // ── Controls ──
  function togglePlay() {
    if (audio.paused) {
      if (isSegmentPracticeMode()) {
        startAutoRepeatSequence();
      } else {
        const modeRange = getCurrentModeRange();
        if (modeRange) {
          segmentEndHandled = false;
          audio.currentTime = modeRange.start;
        }
        safelyPlayAudio();
      }
    } else {
      stopAutoRepeat();
      audio.pause();
      updatePlayBtn(false);
    }
  }

  function updatePlayBtn(playing) {
    isPlaying = playing;
    document.getElementById('iconPlay').style.display = playing ? 'none' : 'block';
    document.getElementById('iconPause').style.display = playing ? 'block' : 'none';
  }

  audio.addEventListener('play', () => {
    updatePlayBtn(true);
    startSegmentBoundaryMonitor();
  });
  audio.addEventListener('pause', () => {
    updatePlayBtn(false);
    stopSegmentBoundaryMonitor();
  });
  audio.addEventListener('ended', stopSegmentBoundaryMonitor);
  audio.addEventListener('error', showPlaybackError);

  // Button bindings
  document.getElementById('btnPlay').onclick = togglePlay;
  document.getElementById('btnPrev').onclick = () => selectSegment(currentSegIdx - 1);
  document.getElementById('btnNext').onclick = goToNextSegmentOrPending;
  document.getElementById('btnRepeat').onclick = () => {
    if (isSegmentPracticeMode()) {
      startAutoRepeatSequence();
      return;
    }
    const modeRange = getCurrentModeRange();
    if (modeRange) {
      stopAutoRepeat();
      segmentEndHandled = false;
      audio.currentTime = modeRange.start;
      updateAudioProgressDisplay();
      safelyPlayAudio();
    }
  };
  document.getElementById('btnBack5').onclick = () => {
    seekWithinCurrentRange(-5);
  };
  document.getElementById('btnFwd5').onclick = () => {
    if (taskTrainingPolicy.review_only && !getCurrentSegmentProgress(getGlobalSegmentIndex())) return;
    seekWithinCurrentRange(5);
  };

  document.getElementById('speedSelect').onchange = function() {
    audio.playbackRate = parseFloat(this.value);
  };
  document.getElementById('repeatCountSelect').onchange = function() {
    repeatCount = parseInt(this.value, 10) || 1;
    if (autoRepeatActive) {
      autoRepeatTargetCount = repeatCount;
      if (autoRepeatCompletedCount >= autoRepeatTargetCount) {
        stopAutoRepeat();
        audio.pause();
        updatePlayBtn(false);
      }
    }
  };
  document.getElementById('repeatGapSelect').onchange = function() {
    repeatGapSeconds = parseInt(this.value, 10) || 2;
  };

  document.getElementById('btnShowText').onclick = function() {
    if (this.disabled) return;
    showOriginal = !showOriginal;
    this.classList.toggle('on', showOriginal);
    renderContent();
  };

  document.getElementById('btnShowTrans').onclick = function() {
    if (this.disabled) return;
    showTranslation = !showTranslation;
    this.classList.toggle('on', showTranslation);
    renderContent();
  };

  document.getElementById('btnSubmitDictation').onclick = checkDictation;
  document.getElementById('btnRetry').onclick = startCorrection;
  document.getElementById('btnNextAfterScore').onclick = goToNextSegmentOrPending;
  document.getElementById('btnResetFreeProgress').onclick = () => {
    if (taskId) return;
    if (!confirm('确认清空本篇自由练习进度？已保存的本地结果会被移除。')) return;
    clearFreeProgress();
    clearFreeDictationTransientState();
    applyCompletedMarkers(freeProgress);
    buildSentenceList();
    updatePracticeSubtitle(freeProgress, totalSegmentCount());
    renderContent();
  };

  function updateModeControls() {
    const segGlobalIdx = getGlobalSegmentIndex();
    const progress = getCurrentSegmentProgress(segGlobalIdx);
    const listened = reviewListenedSegments.has(segGlobalIdx);
    const lockedBeforeFirst = !!(taskTrainingPolicy.locked
      && !taskTrainingPolicy.review_only && !progress);
    const revealAllowed = !taskTrainingPolicy.locked || !!progress
      || (taskTrainingPolicy.review_only && listened);
    const textButton = document.getElementById('btnShowText');
    const transButton = document.getElementById('btnShowTrans');
    textButton.style.display = 'inline-flex';
    textButton.disabled = !revealAllowed;
    transButton.disabled = !revealAllowed;
    textButton.title = revealAllowed ? '显示原文 ( - )' : '完成正式首答或完整听完后开放';
    document.querySelectorAll('.mode-tab').forEach(tab => {
      const targetMode = tab.dataset.mode;
      tab.disabled = taskReadOnly || taskTrainingPolicy.review_only
        ? targetMode !== 'sentence'
        : (lockedBeforeFirst && targetMode !== 'dictation');
      if (taskReadOnly && targetMode === 'dictation') tab.style.display = 'none';
      tab.classList.toggle('active', targetMode === mode);
    });
    const repeatBtn = document.getElementById('btnRepeat');
    repeatBtn.textContent = '↻ 当前句';
  }

  function updateTrainingPolicyUI() {
    const banner = document.getElementById('trainingPolicyBanner');
    if (!banner) return;
    banner.classList.toggle('visible', !!taskTrainingPolicy.locked);
    banner.textContent = taskTrainingPolicy.locked
      ? `正式训练：${taskTrainingPolicy.label || '系统推荐'}。${taskTrainingPolicy.description || ''} 首答后开放复盘与升档，首答成绩不会被覆盖。`
      : '';
  }

  function updateDateGateUI() {
    const banner = document.getElementById('dateGateBanner');
    if (banner) {
      banner.classList.toggle('visible', !!(taskId && taskReadOnly));
      banner.textContent = taskReadOnly
        ? `${taskDateStatusText || '当前仅可查看'}：当前仅可查看，不能答题、计时或提交。`
        : '';
    }
    if (!taskReadOnly) return;
    document.querySelectorAll('#dictationArea input, #dictationArea textarea, #errorSummaryInput').forEach(input => {
      input.disabled = true;
    });
    document.querySelectorAll('#btnSubmitDictation, #btnRetry, #btnTaskCompletionAction').forEach(button => {
      button.disabled = true;
      button.style.display = 'none';
    });
    const actions = document.getElementById('dictationActions');
    if (actions) actions.classList.remove('visible');
    const errorBox = document.getElementById('errorSummaryBox');
    if (errorBox) errorBox.style.display = 'none';
  }

  function completeCurrentReview() {
    if (taskReadOnly) return;
    const segGlobalIdx = getGlobalSegmentIndex();
    if (!taskId || !reviewListenedSegments.has(segGlobalIdx) || !showOriginal) return;
    fetch(`/api/student/listening/task/${taskId}/segment/${segGlobalIdx}/review`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: taskToken,
        listened: true,
        revealed_original: true,
        duration_seconds: computeDurationSeconds(),
      }),
    }).then(r => r.json()).then(result => {
      if (!result.ok) throw new Error(result.error || '保存失败');
      taskProgress[segGlobalIdx] = result.segment;
      applyCompletedMarkers(taskProgress);
      buildSentenceList();
      updatePracticeSubtitle(taskProgress, totalSegmentCount());
      updateTaskCompletionPanel();
      renderContent();
    }).catch(error => alert('保存听辨进度失败：' + error.message));
  }

  function bindErrorSummaryHandlers() {
    const ta = document.getElementById('errorSummaryInput');
    if (!ta) return;
    ta.addEventListener('input', scheduleErrorSummarySave);
    ta.addEventListener('blur', () => {
      if (errorSummaryDirty) persistCurrentErrorSummary(true);
    });
    ta.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        persistCurrentErrorSummary(true);
      }
    });
    window.addEventListener('beforeunload', () => {
      if (errorSummaryDirty) persistCurrentErrorSummary(true);
    });
  }

  // Mode tabs
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.onclick = function() {
      if (this.disabled) return;
      stopAutoRepeat();
      audio.pause();
      mode = this.dataset.mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t === this));
      updateModeControls();
      updateAudioProgressDisplay();
      renderContent();
    };
  });

  // Progress bar click
  document.getElementById('progressTrack').onclick = function(e) {
    if (taskTrainingPolicy.review_only && !getCurrentSegmentProgress(getGlobalSegmentIndex())) return;
    stopAutoRepeat();
    const rect = this.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const range = getCurrentModeRange();
    audio.currentTime = range && isSegmentPracticeMode()
      ? range.start + pct * Math.max(0, range.end - range.start)
      : pct * audio.duration;
    updateAudioProgressDisplay();
  };

  // ── Keyboard Shortcuts ──
  document.addEventListener('keydown', (e) => {
    // Don't trigger shortcuts when typing in inputs
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      if (e.key === ' ' && e.ctrlKey) { e.preventDefault(); togglePlay(); }
      return;
    }

    switch(e.key) {
      case ' ':
        e.preventDefault();
        togglePlay();
        break;
      case '[':
        selectSegment(currentSegIdx - 1);
        break;
      case ']':
        goToNextSegmentOrPending();
        break;
      case 'r':
      case 'R':
        if (isSegmentPracticeMode()) startAutoRepeatSequence();
        break;
      case ',':
      case '<':
        seekWithinCurrentRange(-5);
        break;
      case '.':
      case '>':
        seekWithinCurrentRange(5);
        break;
      case '-':
        document.getElementById('btnShowText').click();
        break;
      case '=':
        document.getElementById('btnShowTrans').click();
        break;
    }
  });

  // ── Helpers ──
  function fmtTime(s) {
    if (!s || isNaN(s)) return '00:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function formatAccuracy(value) {
    const numeric = Number(value || 0);
    return Number.isInteger(numeric) ? String(numeric) : numeric.toFixed(1);
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>精听练习</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/practice_shell.css') }}">
<style>
:root {
  --bg: #f3eee6;
  --sidebar-bg: #171a1e;
  --sidebar-panel: #20242a;
  --sidebar-text: #c8c1b7;
  --sidebar-muted: #8d867d;
  --panel-bg: #fbf8f1;
  --reader-bg: #fffdf8;
  --surface: #fffaf2;
  --surface-muted: #f6f0e7;
  --text: #25211c;
  --text-muted: #746b60;
  --border: #e3d9cb;
  --border-strong: #cfc2b1;
  --accent: #2f8e87;
  --accent-hover: #267873;
  --accent-soft: #e1f3ef;
  --audio-accent: #5b6ee1;
  --audio-soft: #e7e9fb;
  --success: #2f8a5f;
  --warning: #b87317;
  --danger: #c34a3e;
  --shadow-soft: 0 18px 50px rgba(62, 50, 34, 0.08);
  --shadow-control: 0 1px 2px rgba(35, 29, 22, 0.08);
  --radius: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(47, 142, 135, 0.12), transparent 32rem),
    linear-gradient(135deg, #f7f1e8 0%, var(--bg) 55%, #eee8de 100%);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Layout */
.app { display: flex; height: 100vh; }

/* Sidebar */
.sidebar {
  width: 268px;
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  border-right: 1px solid rgba(255,255,255,0.08);
}

.sidebar-header {
  padding: 20px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.sidebar-header h2 {
  font-size: 15px;
  color: #fff;
  margin-bottom: 6px;
  line-height: 1.4;
  font-weight: 650;
}

.sidebar-header .subtitle {
  font-size: 12px;
  color: var(--sidebar-muted);
  line-height: 1.55;
}

.part-tabs {
  display: flex;
  padding: 12px 14px 8px;
  gap: 6px;
}

.part-tab {
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.06);
  color: var(--sidebar-text);
  transition: all 0.2s;
}

.part-tab.active {
  background: #f7efe2;
  border-color: #f7efe2;
  color: #171a1e;
}

.sentence-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px 16px;
}

.sentence-list::-webkit-scrollbar { width: 4px; }
.sentence-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 2px; }

.sentence-item {
  display: flex;
  align-items: center;
  padding: 11px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
  gap: 8px;
  border: 1px solid transparent;
  margin-bottom: 4px;
}

.sentence-item:hover { background: rgba(255,255,255,0.07); }

.sentence-item.active {
  background: linear-gradient(135deg, rgba(47,142,135,0.2), rgba(91,110,225,0.18));
  border-color: rgba(255,255,255,0.12);
  color: #fff;
  box-shadow: inset 3px 0 0 var(--accent);
}

.sentence-item.completed .sent-status {
  color: var(--success);
}

.sent-label { flex: 1; }
.sent-dur {
  font-size: 11px;
  opacity: 0.78;
  font-variant-numeric: tabular-nums;
  padding: 2px 6px;
  border-radius: 999px;
  background: rgba(255,255,255,0.06);
}
.sent-status { width: 16px; font-size: 13px; color: var(--sidebar-muted); }

/* Main Panel */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Top Bar */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: rgba(251, 248, 241, 0.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.topbar-title {
  font-size: 15px;
  font-weight: 650;
  color: #342d25;
}

.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.back-link {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  padding: 7px 10px;
  border-radius: 8px;
  transition: background 0.15s ease, color 0.15s ease;
}

.back-link:hover { background: var(--surface-muted); color: var(--text); }

/* Progress Bar */
.progress-bar-container {
  padding: 14px 28px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border);
}

.audio-progress {
  display: flex;
  align-items: center;
  gap: 12px;
}

.time-display {
  font-size: 12px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  min-width: 45px;
  font-weight: 600;
}

.progress-track {
  flex: 1;
  height: 12px;
  background:
    repeating-linear-gradient(90deg, rgba(91,110,225,0.12) 0 2px, transparent 2px 8px),
    var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--audio-accent));
  border-radius: 999px;
  transition: width 0.1s;
  position: relative;
}

.progress-fill::after {
  content: '';
  position: absolute;
  right: -6px;
  top: -4px;
  width: 16px;
  height: 16px;
  background: var(--audio-accent);
  border-radius: 50%;
  border: 2px solid var(--reader-bg);
  box-shadow: 0 3px 10px rgba(91,110,225,0.28);
  opacity: 0;
  transition: opacity 0.2s;
}

.progress-track:hover .progress-fill::after { opacity: 1; }

/* Sentence markers on progress bar */
.progress-marker {
  position: absolute;
  top: 0;
  width: 1px;
  height: 100%;
  background: rgba(0,0,0,0.15);
}

/* Mode Tabs */
.mode-section {
  padding: 14px 28px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.mode-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }

.mode-tabs {
  display: flex;
  gap: 4px;
  padding: 3px;
  border: 1px solid var(--border);
  background: var(--surface-muted);
  border-radius: 999px;
}

.mode-tab {
  padding: 7px 15px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-size: 13px;
  cursor: pointer;
  background: transparent;
  color: var(--text);
  transition: all 0.2s;
  font-weight: 600;
}

.mode-tab.active {
  background: var(--reader-bg);
  color: var(--accent-hover);
  border-color: rgba(47,142,135,0.18);
  box-shadow: var(--shadow-control);
}

.mode-tab:hover:not(.active) { color: var(--accent); }
.mode-tab:disabled { opacity: .42; cursor: not-allowed; }
.training-policy-banner {
  display: none; margin: 0 24px 12px; padding: 9px 12px; border-radius: 10px;
  background: #ecfdf5; color: #115e59; font-size: 12px; line-height: 1.5;
}
.training-policy-banner.visible { display: block; }

/* Controls */
.controls {
  padding: 14px 28px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  position: relative;
  z-index: 2;
}

.ctrl-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ctrl-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px 13px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--reader-bg);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  box-shadow: var(--shadow-control);
  font-weight: 600;
}

.ctrl-btn:hover {
  border-color: rgba(47,142,135,0.42);
  color: var(--accent-hover);
  background: #fff;
}

.ctrl-btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--audio-accent));
  color: #fff;
  border-color: transparent;
  min-width: 48px;
  min-height: 38px;
}

.ctrl-btn.primary:hover { color: #fff; filter: brightness(0.96); }

.ctrl-btn svg { width: 16px; height: 16px; }

.speed-select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 13px;
  background: var(--reader-bg);
  cursor: pointer;
  color: var(--text);
  font-weight: 600;
}

.ctrl-inline-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-right: 2px;
}

.toggle-group { display: flex; gap: 4px; }

.toggle-btn {
  padding: 8px 13px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--reader-bg);
  font-size: 13px;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.15s;
  box-shadow: var(--shadow-control);
  font-weight: 600;
}

.toggle-btn.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}

/* Content Area */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 48px 28px 56px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background:
    linear-gradient(90deg, rgba(227,217,203,0.32) 1px, transparent 1px) 0 0 / 42px 42px,
    var(--bg);
}

.dictation-box {
  max-width: 860px;
  width: 100%;
  min-height: 248px;
  background: var(--reader-bg);
  border: 1px solid rgba(207,194,177,0.78);
  border-radius: 16px;
  padding: 40px 40px 32px;
  margin-bottom: 30px;
  box-shadow: var(--shadow-soft);
}

/* Sentence display */
.sentence-display {
  font-size: 20px;
  line-height: 2;
  margin-bottom: 24px;
  min-height: 100px;
}

/* Dictation input area */
.dictation-area {
  font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
  font-size: 21px;
  line-height: 2.05;
  word-spacing: 5px;
  color: #2c261f;
  min-height: 148px;
  padding: 10px 6px 28px;
  overflow-wrap: anywhere;
}

.dictation-area .word-slot {
  display: inline-flex;
  align-items: flex-end;
  justify-content: center;
  position: relative;
  width: 112px;
  min-width: 112px;
  min-height: 38px;
  border-bottom: 2px solid var(--border-strong);
  text-align: center;
  margin: 0 3px 8px;
  padding: 0 5px 3px;
  transition: border-color 0.2s;
  vertical-align: baseline;
  background: linear-gradient(180deg, transparent 62%, rgba(91,110,225,0.08) 0);
}

.dictation-area .word-slot.graded {
  width: auto;
}

.dictation-area .word-slot.graded input {
  width: var(--graded-input-width, 102px);
  max-width: min(240px, 64vw);
}

.dictation-area .word-slot:focus-within {
  border-color: var(--accent);
}

.dictation-area .word-visible {
  display: inline;
  margin: 0 2px;
}

.dictation-area input {
  border: none;
  outline: none;
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", sans-serif;
  font-size: 18px;
  text-align: center;
  width: 100%;
  height: 30px;
  line-height: 30px;
  background: transparent;
  color: var(--audio-accent);
  font-weight: 650;
}

.dictation-level-panel {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 0 6px 18px;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-muted);
}

.dictation-level-panel.visible { display: flex; }

.dictation-level-copy { min-width: 0; }
.dictation-level-title { font-size: 13px; font-weight: 700; color: var(--text); }
.dictation-level-desc { margin-top: 3px; font-size: 12px; color: var(--text-muted); }

.dictation-level-options { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.dictation-level-btn {
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 10px;
  background: var(--reader-bg);
  color: var(--text-muted);
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
}
.dictation-level-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hover); }
.dictation-level-btn:disabled { cursor: not-allowed; opacity: 0.68; }

.dictation-intro,
.dictation-empty-state {
  max-width: 620px;
  margin: 18px auto;
  padding: 24px;
  border: 1px dashed var(--border-strong);
  border-radius: 12px;
  background: var(--surface-muted);
  color: var(--text-muted);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.65;
  text-align: center;
}

.dictation-intro strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
.dictation-start-btn,
.dictation-submit-btn {
  margin-top: 14px;
  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.dictation-start-btn:hover,
.dictation-submit-btn:hover { background: var(--accent-hover); }

.dictation-actions {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: -8px 6px 4px;
}
.dictation-actions.visible { display: flex; }
.dictation-action-hint { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.dictation-action-hint.correction { color: var(--warning); }

.dictation-validation-message {
  max-width: 620px;
  margin: 0 auto 12px;
  color: var(--danger);
  font: 13px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  text-align: center;
}

.word-result-label {
  display: inline-flex;
  align-items: center;
  position: absolute;
  top: -15px;
  right: 2px;
  min-height: 22px;
  margin: 0 2px 0 0;
  padding: 2px 5px;
  border-radius: 999px;
  background: var(--surface-muted);
  color: var(--text-muted);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 11px;
  font-weight: 700;
  vertical-align: baseline;
}
.word-result-label.correct { background: #e6f4eb; color: var(--success); }
.word-result-label.incorrect { background: #fff0ed; color: var(--danger); }

.challenge-input {
  display: block;
  width: 100%;
  min-height: 116px;
  padding: 14px 16px;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  outline: none;
  resize: vertical;
  background: var(--reader-bg);
  color: var(--text);
  font: 18px/1.65 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
}
.challenge-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47, 142, 135, 0.12); }
.challenge-input.correct { border-color: var(--success); color: var(--success); }
.challenge-input.incorrect { border-color: var(--danger); color: var(--danger); }
.challenge-results { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.challenge-result { padding: 4px 7px; border-radius: 7px; font-size: 12px; font-weight: 650; }
.challenge-result.correct { background: #e6f4eb; color: var(--success); }
.challenge-result.incorrect { background: #fff0ed; color: var(--danger); }

.dictation-area input.correct {
  color: var(--success);
}

.dictation-area input.incorrect {
  color: var(--danger);
}

/* 原文 / 译文显示 */
.original-text {
  font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
  font-size: 19px;
  line-height: 1.95;
  color: var(--text);
  margin-top: 22px;
  margin-bottom: 12px;
  padding: 18px 20px;
  background: #fbf3df;
  border-left: 3px solid #d9a44a;
  border-radius: 10px;
  display: none;
}

.translation-text {
  font-size: 15px;
  color: var(--text-muted);
  line-height: 1.75;
  margin-top: 12px;
  padding: 14px 18px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: none;
}

.original-text.visible, .translation-text.visible { display: block; }

/* Score bar */
.score-bar {
  margin-top: 24px;
  padding: 16px 18px;
  background: linear-gradient(135deg, var(--accent-soft), var(--audio-soft));
  border: 1px solid rgba(47,142,135,0.18);
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 14px;
}

.score-bar .score {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
}

.score-bar .score-label { color: var(--text-muted); }

.task-completion-panel {
  display: none;
  margin-top: 18px;
  padding: 18px;
  border: 1px solid rgba(217,164,74,0.42);
  border-radius: 12px;
  background: #fff8e9;
}

.task-completion-panel.visible { display: block; }
.task-completion-panel.completed {
  border-color: rgba(47,142,135,0.28);
  background: var(--accent-soft);
}
.task-completion-title { color: var(--text); font-size: 16px; font-weight: 700; }
.task-completion-desc { margin-top: 6px; color: var(--text-muted); font-size: 13px; line-height: 1.65; }
.task-completion-action { margin-top: 12px; }

/* Error summary box */
.error-summary-box {
  margin-top: 18px;
  padding: 16px 18px;
  background: #fff8e9;
  border: 1px solid #ead4a8;
  border-radius: 12px;
}

.error-summary-box .esb-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.error-summary-box .esb-title {
  font-size: 14px;
  font-weight: 600;
  color: #7b5519;
  display: flex;
  align-items: center;
  gap: 6px;
}

.error-summary-box .esb-status {
  font-size: 12px;
  color: var(--text-muted);
  transition: color 0.2s;
}

.error-summary-box .esb-status.saved { color: var(--success); }
.error-summary-box .esb-status.dirty { color: var(--warning); }

.error-summary-box textarea {
  width: 100%;
  min-height: 72px;
  padding: 11px 12px;
  border: 1px solid #e8d1a0;
  border-radius: 9px;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.6;
  resize: vertical;
  background: #fffdf8;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}

.error-summary-box textarea:focus { border-color: #f59e0b; }

.error-summary-box .esb-hint {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-muted);
}

/* Keyboard shortcuts help */
.shortcuts-help {
  padding: 10px 28px;
  background: #eee7dc;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.shortcuts-help kbd {
  display: inline-block;
  padding: 2px 6px;
  background: var(--reader-bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-family: inherit;
  font-size: 11px;
  color: var(--text);
}

.date-gate-banner {
  display: none;
  padding: 12px 28px;
  background: #fff4df;
  border-bottom: 1px solid #e6c98f;
  color: #8a5a12;
  font-size: 14px;
  line-height: 1.5;
}

.date-gate-banner.visible { display: block; }

/* Difficulty slider */
.difficulty-section {
  padding: 12px 28px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
}

.difficulty-slider-wrap {
  flex: 1;
  max-width: 320px;
}

.difficulty-slider {
  width: 100%;
  height: 8px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  outline: none;
  margin-bottom: 4px;
}

.difficulty-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--audio-accent);
  cursor: pointer;
  border: 2px solid var(--reader-bg);
  box-shadow: 0 3px 10px rgba(91,110,225,0.22);
}

.difficulty-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.3;
}

.difficulty-labels span.active {
  color: var(--accent);
  font-weight: 600;
}

/* Mobile */
@media (max-width: 768px) {
  .sidebar { width: 100%; height: auto; max-height: 200px; }
  .app { flex-direction: column; }
  .sentence-list { display: flex; overflow-x: auto; overflow-y: hidden; padding: 8px; gap: 4px; }
  .sentence-item { white-space: nowrap; padding: 8px 12px; }
  .controls { justify-content: center; }
  .topbar, .progress-bar-container, .mode-section, .controls, .shortcuts-help { padding-left: 16px; padding-right: 16px; }
  .content-area { padding: 36px 14px 44px; }
  .dictation-box { min-height: 214px; padding: 34px 18px 28px; border-radius: 12px; margin-bottom: 28px; }
  .dictation-area { font-size: 19px; line-height: 1.95; min-height: 142px; padding: 8px 2px 28px; }
  .dictation-area .word-slot { width: 104px; min-width: 104px; min-height: 34px; margin-bottom: 7px; }
  .dictation-level-panel { align-items: flex-start; flex-direction: column; gap: 10px; }
  .dictation-level-options { justify-content: flex-start; }
  .dictation-actions { align-items: flex-start; flex-direction: column; }
}
</style>
</head>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 id="exerciseTitle">精听练习</h2>

    <div class="part-tabs" id="partTabs"></div>

  </aside>

  <!-- Main -->
  <div class="main">

    <div class="topbar">
      <div class="topbar-title" id="currentSentenceLabel">第1句</div>
      <div class="topbar-actions">
        <span class="practice-shell__save" data-practice-save-status aria-live="polite">已保存</span>
        <button class="practice-shell__retry" type="button" data-practice-save-retry hidden>重试</button>
        <button class="ctrl-btn" id="btnResetFreeProgress" type="button" style="display:none">重置本地进度</button>
        <button class="practice-shell__back back-link" type="button" data-practice-back>← 返回精听列表</button>
        <button class="practice-shell__back back-link" type="button" data-practice-module-exit>退出刷题</button>

        <button class="mode-tab" data-mode="dictation">听写模式</button>

    <div class="training-policy-banner" id="trainingPolicyBanner"></div>

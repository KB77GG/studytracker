<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入学测试 · 邀请管理</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
:root{--navy:#0d2d3e;--ivory:#f8f4ec;--surface:#fffefa;--soft:#fbf8f2;--line:#e4ddd2;--line-strong:#d6cfc2;--ink:#132a36;--muted:#70807d;--sage:#168b78;--sage-dark:#0e7062;--sage-soft:#e7f4ef;--danger:#c74837}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.entrance-shell{display:flex;min-height:100vh}.entrance-sidebar{position:sticky;top:0;width:226px;height:100vh;flex:0 0 226px;display:flex;flex-direction:column;padding:24px 14px 16px;background:linear-gradient(180deg,var(--navy),#0b2939);color:#fff}.entrance-brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}.entrance-brand img{width:42px;height:42px;padding:4px;object-fit:contain;border:1px solid rgba(255,255,255,.38);border-radius:14px;background:#fffaf2;box-shadow:0 5px 16px rgba(2,18,29,.24)}.entrance-brand strong,.entrance-brand span{display:block}.entrance-brand strong{font-size:17px}.entrance-brand span{margin-top:3px;color:rgba(255,255,255,.62);font-size:11px}.entrance-nav-label{margin:9px 10px 6px;color:rgba(255,255,255,.46);font-size:10px;letter-spacing:.12em}.entrance-nav{display:grid;gap:4px}.entrance-nav a{min-height:42px;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:rgba(255,255,255,.86);font-size:13px;font-weight:700;text-decoration:none}.entrance-nav a i{width:20px;text-align:center}.entrance-nav a:hover{background:rgba(22,139,120,.24);color:#fff}.entrance-nav a.active{background:linear-gradient(135deg,#148f7b,#1a7d70);color:#fff}.entrance-sidebar__footer{margin-top:auto;padding:12px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.07);font-size:12px}.entrance-main{min-width:0;flex:1}.entrance-header{position:relative;min-height:154px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;width:min(100%,1680px);margin:auto;padding:28px 36px 18px;background:url("../../static/brand/tasks-header-wave.png") 67% top/min(720px,62%) auto no-repeat}.entrance-header small{display:block;margin-bottom:8px;color:var(--sage-dark);font-size:11px;font-weight:850;letter-spacing:.13em}.entrance-header h1{margin:0;font-size:34px;line-height:1.08;letter-spacing:-.035em}.entrance-header p{margin:8px 0 0;color:var(--muted);font-size:13px}.entrance-header__actions{display:flex;align-items:center;gap:10px;padding-right:74px}.entrance-search{width:clamp(250px,28vw,390px);min-height:42px;display:flex;align-items:center;gap:9px;padding:0 11px;border:1px solid var(--line-strong);border-radius:9px;background:rgba(255,254,250,.9);color:#8b9997}.entrance-search input{width:100%;height:40px;border:0;background:transparent;outline:0;color:var(--ink)}.entrance-header__avatar{position:absolute;top:24px;right:36px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--sage);color:#fff;font-size:13px;font-weight:800}.entrance-content{width:min(100%,1680px);margin:auto;padding:0 36px 36px}.entrance-workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(350px,.9fr);min-height:calc(100vh - 190px);overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 10px 28px rgba(19,42,54,.055)}.entrance-list{min-width:0}.entrance-tabs{min-height:55px;display:flex;align-items:stretch;gap:8px;padding:0 20px;border-bottom:1px solid var(--line)}.entrance-tabs span,.entrance-tabs a{display:flex;align-items:center;padding:0 10px;border-bottom:3px solid transparent;color:var(--muted);font-size:13px;font-weight:800;text-decoration:none}.entrance-tabs .active{border-bottom-color:var(--sage);color:var(--sage-dark)}.entrance-toolbar{min-height:70px;display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--soft)}.entrance-toolbar select{min-height:38px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--ink)}.entrance-toolbar a{margin-left:auto;color:var(--sage-dark);font-size:12px;font-weight:800;text-decoration:none}.entrance-table-wrap{overflow:auto}.entrance-table{width:100%;min-width:760px;border-collapse:collapse}.entrance-table th{height:42px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;text-align:left}.entrance-table td{height:66px;padding:11px 14px;border-bottom:1px solid #eee8df;color:#3e5661;font-size:12px}.entrance-table tbody tr:hover{background:#fbfaf5}.entrance-inspector{display:flex;flex-direction:column;padding:22px;border-left:1px solid var(--line);background:#fffefa}.entrance-inspector h2{margin:0 0 18px;font-size:14px}.entrance-inspector__intro{display:flex;align-items:center;gap:11px;margin-bottom:16px}.entrance-inspector__icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--sage-soft);color:var(--sage-dark);font-size:16px}.entrance-inspector__intro strong{display:block;font-size:16px}.entrance-inspector__intro span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.entrance-section{padding:15px 0;border-top:1px solid var(--line)}.entrance-section h3{margin:0 0 10px;font-size:12px}.entrance-form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.entrance-form label{display:grid;gap:5px;color:var(--muted);font-size:10px;font-weight:800}.entrance-form label.wide{grid-column:1 / -1}.entrance-form input,.entrance-form select{width:100%;min-height:38px;padding:8px 9px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--ink)}.entrance-primary{grid-column:1 / -1;min-height:42px;border:1px solid var(--sage);border-radius:8px;background:var(--sage);color:#fff;font-weight:800;cursor:pointer}.entrance-result{margin-top:14px;padding:12px;border:1px solid #b9d8cf;border-radius:8px;background:var(--sage-soft);font-size:11px}.entrance-result.hidden,.entrance-error.hidden{display:none}.entrance-result div{display:flex;gap:7px;margin-top:8px}.entrance-result input{min-width:0;flex:1}.entrance-result button{border:0;border-radius:7px;background:var(--sage-dark);color:#fff}.entrance-error{margin-bottom:12px;padding:11px;border:1px solid #edc9c2;border-radius:8px;background:#fff2ef;color:var(--danger);font-size:12px}@media(max-width:1050px){.entrance-sidebar{width:190px;flex-basis:190px}.entrance-workspace{grid-template-columns:1fr}.entrance-inspector{border-top:1px solid var(--line);border-left:0}}@media(max-width:760px){.entrance-sidebar{position:fixed;z-index:20;transform:translateX(-100%)}.entrance-header{min-height:205px;display:block;padding:22px 15px}.entrance-header__actions{margin-top:18px;padding:0}.entrance-search{width:100%}.entrance-content{padding:0 12px 24px}.entrance-header__avatar{right:15px}.entrance-form{grid-template-columns:1fr}.entrance-form label.wide{grid-column:auto}}
</style>
</head>
<body>
<div class="entrance-shell">
  <aside class="entrance-sidebar">
    <div class="entrance-brand"><img src="/static/brand/sagepath-mark.png" alt="Sage Path 睿然国际教育" width="42" height="42"><div><strong>Sage Path</strong><span>学习计划与打卡系统</span></div></div>
    <p class="entrance-nav-label">主导航</p>
    <nav class="entrance-nav">
      <a href="/materials"><i class="fas fa-book-open" aria-hidden="true"></i>材料库</a><a href="/admin/word-examples"><i class="fas fa-spell-check" aria-hidden="true"></i>词汇审核</a><a href="/tasks"><i class="fas fa-clipboard-list" aria-hidden="true"></i>任务管理</a><a href="/teacher/grading"><i class="fas fa-check-double" aria-hidden="true"></i>批改中心</a><a href="/admin/course-plan"><i class="fas fa-calendar-alt" aria-hidden="true"></i>课程计划</a><a href="/practice"><i class="fas fa-layer-group" aria-hidden="true"></i>刷题 / 模考</a><a href="/admin/mock-exams"><i class="far fa-file-alt" aria-hidden="true"></i>模考配卷</a><a class="active" href="/entrance/admin/invitations.html"><i class="fas fa-user-check" aria-hidden="true"></i>入学测试</a>
    </nav>
    <p class="entrance-nav-label">数据分析</p><nav class="entrance-nav"><a href="/report"><i class="fas fa-chart-line" aria-hidden="true"></i>学习报表</a><a href="/admin/stage-report"><i class="fas fa-chart-bar" aria-hidden="true"></i>阶段报告</a></nav>
    <p class="entrance-nav-label">系统</p><nav class="entrance-nav"><a href="/bulk"><i class="fas fa-users" aria-hidden="true"></i>批量添加</a><a href="/users"><i class="fas fa-user-cog" aria-hidden="true"></i>用户管理</a></nav>
    <div class="entrance-sidebar__footer">Sage Path 管理后台</div>
  </aside>
  <main class="entrance-main">
    <header class="entrance-header"><div><small>ENTRANCE TEST</small><h1>入学测试</h1><p>生成测试邀请并跟踪诊断进度</p></div><div class="entrance-header__actions"><label class="entrance-search"><i class="fas fa-search" aria-hidden="true"></i><input id="entrance-search" type="search" placeholder="搜索学生姓名、考试类型、试卷名称"></label></div><span class="entrance-header__avatar">A</span></header>
    <div class="entrance-content">
      <div id="auth-error" class="entrance-error hidden"></div>
      <section class="entrance-workspace">
        <div class="entrance-list">
          <nav class="entrance-tabs"><span class="active">邀请管理</span><a href="papers.html">试卷管理</a><span>待批改</span></nav>
          <div class="entrance-toolbar"><label>状态 <select id="filter-status"><option value="">全部状态</option><option value="pending">待开始</option><option value="in_progress">答题中</option><option value="submitted">待批改</option><option value="graded">已批改</option></select></label><a href="papers.html"><i class="far fa-file-alt" aria-hidden="true"></i> 题库管理</a></div>
          <div class="entrance-table-wrap"><table class="entrance-table"><thead><tr><th>学生</th><th>试卷</th><th>状态</th><th>创建时间</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="invite-list"><tr><td colspan="6">加载中...</td></tr></tbody></table></div>
        </div>
        <aside class="entrance-inspector"><h2>生成测试邀请</h2><div class="entrance-inspector__intro"><span class="entrance-inspector__icon"><i class="fas fa-user-check" aria-hidden="true"></i></span><div><strong>新建专属诊断入口</strong><span>填写学生信息并选择适合的试卷</span></div></div>
          <section class="entrance-section"><form id="create-form" class="entrance-form">
            <label>学生姓名 *<input name="student_name" required></label><label>年龄<input name="student_age" type="number" min="5" max="60"></label><label>年级<input name="student_grade" placeholder="高一 / 初三"></label><label>联系电话<input name="student_phone"></label>
            <label>目标考试 *<select name="target_exam" required><option value="ielts">IELTS 雅思</option><option value="toefl">TOEFL 托福</option><option value="toefl_junior">TOEFL Junior 小托福</option></select></label><label>学习经历<select name="has_studied_target"><option value="false">未系统学习</option><option value="true">已系统学习</option></select></label>
            <label class="wide">测试试卷 *<select name="paper_id" id="paper-select" required><option value="">加载中...</option></select></label><button type="submit" class="entrance-primary"><i class="fas fa-link" aria-hidden="true"></i> 生成测试链接</button>
          </form>
          <div id="create-result" class="entrance-result hidden"><strong>邀请已生成</strong><p>复制专属链接发送给学生。</p><div><input id="result-link" readonly><button id="copy-btn" type="button">复制</button></div></div></section>
          <section class="entrance-section"><h3>操作说明</h3><p style="margin:0;color:var(--muted);font-size:11px;line-height:1.65">学生开始作答后，可在左侧查看状态；已提交的测试可进入批改与报告页面。</p></section>
        </aside>
      </section>
    </div>
  </main>
</div>
<script src="../assets/admin.js"></script>
<script>
initInvitationsPage();
document.getElementById('entrance-search').addEventListener('input',function(){const query=this.value.trim().toLowerCase();document.querySelectorAll('#invite-list tr').forEach(function(row){row.hidden=Boolean(query&&!row.textContent.toLowerCase().includes(query));});});
</script>
</body>
</html>
